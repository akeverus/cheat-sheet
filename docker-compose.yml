# Запуск:   docker compose up -d
# Логи:     docker compose logs -f interview-prep
# Перед стартом скопируй .env.example → .env и заполни ключи.
services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-interview} -d interview"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  interview-prep:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
        # Эти переменные обычно проставляет CI; для локальной сборки
        # docker-compose.yml оставляет «unknown» — это нормально.
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
    image: cheat-sheet-quiz:${APP_VERSION:-latest}
    container_name: quiz-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Spring Boot пишет tmp/файлы в /tmp; volume tmpfs ограничивает запись
    # туда и носит как ephemeral. Размер 128m достаточен для типового
    # Spring Boot upload-flow и Hibernate temp.
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # MaxRAMPercentage=75: heap = 75% от лимита контейнера (cgroup-aware).
      # ExitOnOutOfMemoryError: на OOM JVM сразу exit, K8s/compose рестартанёт
      #   контейнер вместо degraded-зависания с GC thrashing.
      # HeapDumpOnOutOfMemoryError → /tmp (tmpfs) — есть с чем разбираться при
      #   post-mortem. Не оставит мусора на хосте: tmpfs ephemeral.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof}
      # Primary: openai или deepseek (AI используется только при AI_FALLBACK_ENABLED=true)
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-interview}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-interview}
      # Опционально: DeepSeek/OpenAI для генерации вариантов
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Токен для admin-операций (reset-all, options/clear)
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:-}
      PRELOAD_STARTUP_PRELOAD: ${PRELOAD_STARTUP_PRELOAD:-false}
      PRELOAD_FULL_WARMUP: ${PRELOAD_FULL_WARMUP:-false}
      PRELOAD_WARMUP_RANDOM_SEED: "42"
      QUALITY_ITERATIONS_ENABLED: ${QUALITY_ITERATIONS_ENABLED:-false}
      QUALITY_ITERATIONS_COUNT: ${QUALITY_ITERATIONS_COUNT:-10}
      QUALITY_ITERATIONS_SAMPLE_SIZE: ${QUALITY_ITERATIONS_SAMPLE_SIZE:-10}
      QUALITY_ITERATIONS_TARGET_SCORE: ${QUALITY_ITERATIONS_TARGET_SCORE:-90}
      QUALITY_ITERATIONS_SLEEP_MS: ${QUALITY_ITERATIONS_SLEEP_MS:-0}
      QUALITY_ITERATIONS_MAX_PROMPT_RULES: ${QUALITY_ITERATIONS_MAX_PROMPT_RULES:-6}
      INTERVIEW_RESET_ON_STARTUP: ${INTERVIEW_RESET_ON_STARTUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # readiness включает db + seedCoverage — если БД отвалилась или сидеры
      # не загрузились, docker compose выведет контейнер из healthy и
      # downstream depends_on/балансировщики увидят сигнал.
      # Под не перезапускается (это бы делал liveness, тут он избыточен —
      # docker compose не различает «убить» и «выключить из трафика»,
      # но readiness — самый информативный сигнал для оператора).
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Volume для двусторонней синхронизации избранного между UI и MD-файлами
    volumes:
      - ./cheatsheets:/app/cheatsheets

volumes:
  postgres-data:
    driver: local
