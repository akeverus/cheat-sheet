spring:
  datasource:
    # Testcontainers JDBC поднимает PostgreSQL 16 контейнер автоматически.
    # Без TC_REUSABLE — каждый прогон стартует с чистой БД, чтобы тесты
    # не зависели от данных от предыдущего запуска (visual baseline и т.д.).
    url: jdbc:tc:postgresql:16-alpine:///interview
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Переопределяется в ExportIntegrationTest через @DynamicPropertySource для пути, не зависящего от CWD
  interviewPath: src/test/resources/test-interview
  admin-token: test-secret-token
