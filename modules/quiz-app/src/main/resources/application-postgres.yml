# ===========================
# Профиль PostgreSQL (Docker)
# ===========================
# Переменные SPRING_DATASOURCE_* из окружения имеют приоритет над POSTGRES_*
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview}
    username: ${POSTGRES_USER:interview}
    password: ${POSTGRES_PASSWORD:interview}
  flyway:
    locations: classpath:db/migration-postgres
    baseline-on-migrate: true
