server:
  port: ${SERVER_PORT:8080}
  # Graceful shutdown: при SIGTERM сервер перестаёт принимать новые запросы,
  # но даёт активным завершиться. K8s/docker compose шлют SIGTERM до SIGKILL
  # (по умолчанию 30s grace), поэтому Spring lifecycle тоже 30s.
  shutdown: graceful
  # При работе за reverse proxy (nginx, Cloudflare, K8s Ingress) поднимаем
  # X-Forwarded-* headers, чтобы Spring видел реальную схему (https) и IP
  # клиента. Без этого Spring Security ломает same-site cookies, а
  # CookieCsrfTokenRepository — Secure флаг. SERVER_FORWARD_HEADERS=none
  # для случая «без proxy», по умолчанию — framework.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS:framework}
  # GZIP для текстового контента. /stats и /index возвращают большой HTML —
  # сжатие даёт 5-10× меньше bandwidth. min-response-size=1KB чтобы не
  # тратить CPU на мелкие ответы (actuator/health, JSON-фрагменты).
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,application/json,image/svg+xml
    min-response-size: 1KB

spring:
  application:
    name: interview-prep
    version: "@projectVersion@"
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    # PostgreSQL — единственная поддерживаемая БД. На локалке поднимай через
    # docker-compose (см. README) или укажи свои POSTGRES_* в env.
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:interview}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:interview}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # leak-detection-threshold: если connection не вернётся в пул за 30s,
      # Hikari логирует stack trace его получения. Ловит места где код
      # забывает try-with-resources или транзакцию. Норм. Hikari connection
      # реально удерживается на длинных запросах, поэтому 30s — большой
      # запас. 0 = отключено (default), не рекомендуется в проде.
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}
      # reWriteBatchedInserts превращает N мелких INSERT в один большой
      # INSERT VALUES (...), (...), (...) на стороне драйвера. На стартовом
      # импорте сидеров (77 топиков × N вопросов × 4 опции) даёт 5-10×
      # speedup; для обычного OLTP-трафика прозрачно — без бэтча действует
      # как обычный INSERT.
      data-source-properties:
        reWriteBatchedInserts: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    enabled: true
    # При INTERVIEW_RESET_ON_STARTUP=true Flyway сначала чистит схему,
    # потом накатывает миграции — удобно для перезаливки vault из JSON-сидеров.
    clean-on-validation-error: false
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
  thymeleaf:
    cache: false
  # Статика (CSS/JS/images) — version-busted через ?v=N в head fragment,
  # поэтому безопасно кэшировать агрессивно. В dev переопредели
  # через STATIC_RESOURCES_CACHE_SECONDS=0 если правишь editorial.css вживую.
  web:
    resources:
      cache:
        cachecontrol:
          max-age: ${STATIC_RESOURCES_CACHE_SECONDS:86400}s
          must-revalidate: true

# ===========================
# Конфигурация приложения
# ===========================
app:
  # Путь к markdown-файлам с вопросами
  interview-path: cheatsheets/interview
  # Каталог групп/порядка тем для UI и селектора вопросов
  topic-groups-config: topic-groups.yaml

  # --- Безопасность чувствительных endpoint ---
  admin-token: ${APP_ADMIN_TOKEN:}
  regenerate-rate-limit-per-minute: ${REGENERATE_RATE_LIMIT_PER_MINUTE:20}

  # --- Планировщик интервального повторения ---
  scheduling:
    # sm2 (по умолчанию, fallback) | fsrs (FSRS-4.5). Прогресс SM-2 при переходе на
    # fsrs сидируется автоматически (interval→stability, ease→difficulty).
    algorithm: ${SCHEDULING_ALGORITHM:sm2}

  # --- Параметры тестирования ---
  interview:
    learned-repetitions: 3        # порог «выучено»
    exam-penalty-questions: 5     # штрафные вопросы при ошибке в экзамене
    max-session-count: 200        # максимум вопросов в сессии (защита от DoS)
    default-exam-count: 20       # дефолтное число вопросов в экзамене
    default-marathon-count: 50   # дефолтное число вопросов в марафоне
    default-daily-goal: 10         # цель на день для streak-бара
    senior-rule-priority-overrides: {} # пример: {spring-transactional: 5, sql-null-semantics: 4}

  # --- Кэш вариантов ответов ---
  cache:
    option-max-size: 500
    ttl-hours: 1

  # --- Полнотекстовый поиск ---
  search:
    max-limit: 100
    preview-max-length: 300      # максимальная длина превью ответа в поиске
    stats-results-limit: 20     # лимит результатов поиска на странице статистики

  # --- Импорт вопросов из markdown ---
  import-settings:
    min-code-block-length: 50   # минимальная длина code block для типа CODE

  # --- Сброс БД при старте + переимпорт вопросов и MCQ из JSON-сидеров.
  # При true приложение чистит questions/answer_options через TRUNCATE и
  # переимпортирует всё из cheatsheets/interview/**/*.md + seed/mcq/**.json.
  # Никакого AI в этом цикле не вызывается.
  interview-reset-on-startup: ${INTERVIEW_RESET_ON_STARTUP:false}

  # --- Security ---
  security:
    cors:
      allowed-origins:
        - http://localhost:8080
        - http://127.0.0.1:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Content-Type
        - X-Admin-Token
        - X-CSRF-TOKEN
      exposed-headers:
        - Retry-After
      allow-credentials: true
      max-age-seconds: 3600

# --- Actuator (health для Docker / Kubernetes healthcheck) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Включаем /actuator/health/liveness и /actuator/health/readiness —
      # отдельные пробы для K8s/cloud-runner, чтобы оркестратор различал
      # «процесс жив» и «готов принимать трафик».
      probes:
        enabled: true
      show-details: never
      show-components: never
      # Кэшируем агрегированный health на 5s. K8s liveness/readiness обычно
      # 10s, docker compose healthcheck 10s — значит примерно каждый
      # второй scrape отдаётся из памяти без удара по БД и seedCoverage SQL.
      cache:
        time-to-live: ${HEALTH_CACHE_SECONDS:5}s
      # liveness намеренно МИНИМАЛЕН: жив, если JVM не зависла. Не должен
      # упасть от деградации БД или сидеров — иначе K8s рестартанёт под
      # без шанса на самовосстановление.
      # readiness = «может ли инстанс принимать трафик». Включает БД (нет
      # коннекта — обслуживать нечего), но НЕ seedCoverage: неполнота MCQ —
      # это про контент, а не про трафик. Приложение корректно отдаёт вопросы
      # во flashcard-режиме при любом coverage, поэтому гейтить readiness
      # долей сидеров — category error: контейнер навсегда оставался unhealthy
      # на честной in-progress миграции, оркестратор не пускал трафик.
      # seedCoverage остаётся в агрегатном /actuator/health как сигнал
      # мониторинга (см. SeedCoverageHealthIndicator), но не блокирует трафик.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
    git:
      enabled: false
    build:
      enabled: true
  # Общий тег ко всем Micrometer-метрикам. Когда Prometheus собирает несколько
  # сервисов на один scrape — application=interview-prep даёт filter в Grafana
  # и предотвращает коллизию metric names между сервисами.
  metrics:
    tags:
      application: interview-prep
      env: ${APP_ENV:dev}
