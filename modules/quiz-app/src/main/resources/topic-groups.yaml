    description: "SQL и NoSQL хранилища"
    order: 50
    icon: stickers/database.png
  - id: architecture
    title: Архитектура и системный дизайн
    description: "Системный дизайн и распределенные системы"
    order: 60
    icon: stickers/network.png
  - id: backend-practice
    title: Backend-разработка
    description: "API, тестирование, безопасность, наблюдаемость"
    order: 70
    icon: stickers/terminal.png
  - id: delivery
    title: Поставка и DevOps
    description: "CI/CD, DevOps, эксплуатация"
    order: 80
    icon: stickers/cloud-upload.png
  - id: engineering
    title: Инженерные практики
    description: "Качество кода, лидерство, процессы"
    order: 90
    icon: stickers/target.png
  - id: misc
    title: Прочее
    description: "Прочие темы"
    order: 100
    icon: stickers/question.png

