# icon — путь относительно /img/ для карточки раздела в каталоге тем на /stats.
# Опознавательный знак раздела: раздел ищут глазами по картинке, а не перечитывая
# десять заголовков подряд. Иконка декоративная (aria-hidden) — смысл несёт
# заголовок, поэтому пустое поле или отсутствующий файл деградируют молча.
groups:
  - id: foundation
    title: Основы
    description: "Базовые темы для старта подготовки"
    order: 10
    icon: stickers/book.png
