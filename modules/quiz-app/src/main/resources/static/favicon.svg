<?xml version="1.0" encoding="UTF-8"?>
<!-- Бренд Editorial (Anthropic-якорь): Clay-плитка (#D97757 — accent-primary
     [spec]) + чернильная «Q» (#141413 — текст на терракоте идёт чернилами, не
     белым: и в UI, и здесь, единый контракт accent-on). Радиус 0 — flat-сигнатура
     якоря. Плитка самодостаточна (свой фон) → читаема и на светлой, и на тёмной
     строке вкладок без prefers-color-scheme-трюков. Serif-стек (Georgia)
     перекликается с display-шрифтом Lora. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#D97757"/>
  <text x="50%" y="55%" font-family="Georgia,'Times New Roman',serif" font-size="21" font-weight="700"
        fill="#141413" text-anchor="middle" dominant-baseline="middle">Q</text>
</svg>
