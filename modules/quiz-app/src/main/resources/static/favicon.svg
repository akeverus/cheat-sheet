<?xml version="1.0" encoding="UTF-8"?>
<!-- Бренд editorial-редизайна: терракотовая плитка (#A8431F — accent-primary) +
     кремовая «Q» (#F7F3EA). Раньше favicon был из СТАРОЙ индиго-палитры
     (#1f2336 + #ffe066), снятой вместе с индиго-пилюлями/Syne — иконка вкладки
     не совпадала с фирменным стилем. Плитка самодостаточна (свой фон) → читаема
     и на светлой, и на тёмной строке вкладок без prefers-color-scheme-трюков.
     Serif-стек (Georgia) перекликается с display-шрифтом Fraunces. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#A8431F"/>
  <text x="50%" y="55%" font-family="Georgia,'Times New Roman',serif" font-size="21" font-weight="700"
        fill="#F7F3EA" text-anchor="middle" dominant-baseline="middle">Q</text>
</svg>
