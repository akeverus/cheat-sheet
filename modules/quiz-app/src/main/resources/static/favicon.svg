<?xml version="1.0" encoding="UTF-8"?>
<!-- Бренд-якорь pixel-art (GFX-P1-04, Graphics Review V2): раньше здесь была
     терракотовая serif-«Q» от старого Editorial-дизайна — она конфликтовала с
     действующей teal/cyan pixel-art robot/terminal идентичностью (тот же дизайн,
     что sidebar-маскот и весь data-design="instrument"). Заменено на pixel-робота
     из separated-assets-kit: teal #39d0c7 = ровно app-шный pixel-teal
     rgba(57,208,199). shape-rendering=crispEdges сохраняет чёткую pixel-сетку в
     16/32 px. Тёмная плитка #071219 самодостаточна → читается и на светлой, и на
     тёмной строке вкладок без prefers-color-scheme-трюков. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#071219"/>
  <rect x="3" y="3" width="26" height="26" fill="#10242d" stroke="#39d0c7" stroke-width="2"/>
  <rect x="9" y="8" width="14" height="11" fill="#eef7f7"/>
  <rect x="11" y="10" width="10" height="7" fill="#10242d"/>
  <rect x="13" y="12" width="2" height="2" fill="#39d0c7"/>
  <rect x="18" y="12" width="2" height="2" fill="#39d0c7"/>
  <rect x="13" y="16" width="7" height="1" fill="#35c987"/>
  <rect x="14" y="4" width="4" height="4" fill="#39d0c7"/>
  <rect x="10" y="21" width="5" height="5" fill="#9db1b6"/>
  <rect x="18" y="21" width="5" height="5" fill="#9db1b6"/>
</svg>
