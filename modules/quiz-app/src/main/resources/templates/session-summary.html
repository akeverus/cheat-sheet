<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Итоги сессии', includeMermaid=false, includeChart=false)}"></head>
<body>
<a class="skip-link" href="#main-content">Перейти к итогам сессии</a>
<header th:replace="~{fragments/header :: header(pageTitle='Итоги сессии', statsPage=false, activePage='focus', showPrimaryNav=true)}"></header>
<main id="main-content">
<section class="card summary-score">
    <div class="summary-mode-line" th:text="${summary.mode}"></div>
    <div class="summary-score-value"
         th:classappend="${summary.accuracy >= 80} ? 'text-success' : (${summary.accuracy >= 50} ? 'text-warning' : 'text-danger')"
         th:text="${summary.accuracyFormatted + '%'}">0%</div>
    <div class="summary-score-label">Точность</div>
    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-label">Всего</span>
            <div class="stat-value" th:text="${summary.totalQuestions}">0</div>
        </div>
        <div class="stat-item">
            <span class="stat-label">Верно</span>
            <div class="stat-value" th:text="${summary.correctCount}">0</div>
        </div>
        <div class="stat-item">
            <span class="stat-label">Ошибки</span>
            <div class="stat-value" th:text="${summary.wrongCount}">0</div>
        </div>
    </div>
    <div class="summary-duration" th:text="'Время: ' + ${summary.formattedDuration}"></div>
</section>

<!-- Результаты по темам -->
<section class="card" th:if="${!summary.topicResults.isEmpty()}">
    <h3 class="summary-section-title">Результаты по темам</h3>
    <table class="summary-table">
        <caption>Результаты по темам</caption>
        <thead>
        <tr>
            <th>Тема</th>
            <th class="summary-th-center">Всего</th>
            <th class="summary-th-center">Верно</th>
            <th class="summary-th-center">Ошибки</th>
            <th class="summary-th-center">Точность</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tr : ${summary.topicResults}">
            <td th:text="${@topicUtils.displayName(tr.topic())}">topic</td>
            <td class="summary-td-center" th:text="${tr.total()}">0</td>
            <td class="summary-td-center summary-td-correct" th:text="${tr.correct()}">0</td>
            <td class="summary-td-center summary-td-wrong" th:text="${tr.wrong()}">0</td>
            <td class="summary-td-center summary-td-accuracy"
                th:classappend="${tr.accuracy() >= 80} ? 'text-success' : (${tr.accuracy() >= 50} ? 'text-warning' : 'text-danger')"
                th:text="${#numbers.formatDecimal(tr.accuracy(), 1, 0) + '%'}">0%</td>
        </tr>
        </tbody>
    </table>
</section>

<!-- Ошибки -->
<section class="card" th:if="${!summary.mistakes.isEmpty()}">
    <h3 class="summary-section-title">Ошибки</h3>
    <div class="summary-mistakes">
        <div th:each="m : ${summary.mistakes}" class="summary-mistake-item">
            <div class="summary-mistake-question" th:text="${m.questionText()}">Вопрос</div>
            <div class="summary-mistake-meta" th:text="${@topicUtils.displayName(m.topic())}">topic</div>
        </div>
    </div>
</section>

<!-- Рекомендации -->
<section class="card summary-recommendations" th:if="${!summary.recommendations.isEmpty()}">
    <h3>Рекомендации</h3>
    <div th:each="rec : ${summary.recommendations}" class="summary-recommendation-item" th:text="${rec}">Рекомендация</div>
</section>

<div class="summary-actions">
    <a class="btn next-btn" th:href="@{/}">Продолжить тренировку</a>
</div>
</main>
</body>
</html>
