<!DOCTYPE html>
<html lang="ru" data-design="instrument" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Ошибка — Подготовка к собеседованию', includeMermaid=false, includeChart=false, includeHighlight=false, page='error')}"></head>
<body class="error-page">
<a class="skip-link" href="#main-content">Перейти к сообщению об ошибке</a>
<svg th:replace="~{fragments/pixel-sprite :: sprite}"></svg>
<svg th:replace="~{fragments/icons :: sprite}"></svg>
<div class="app">
    <aside th:replace="~{fragments/sidebar :: sidebar(active='focus')}"></aside>
    <div class="shell-main">
        <th:block th:replace="~{fragments/topbar :: topbar}"></th:block>
<main id="main-content" class="ed-page" tabindex="-1">
<section class="error-card" aria-labelledby="error-heading">
    <img class="error-pixel-art" th:src="@{/img/pixel/mascot.png}" width="120" height="120" alt="" decoding="async">
    <p class="error-eyebrow" aria-hidden="true">Ошибка</p>

    <!--/* Большой статус-номер как editorial-композиция (декоративный, реальный
         заголовок — error-title ниже). Для не-числовых ошибок показываем знак. */-->
    <div class="error-code" th:text="${status} ?: '×'" aria-hidden="true">500</div>

    <h1 id="error-heading" class="error-title"
        th:with="code=${status != null ? status : 500}"
        th:text="${code == 404 ? 'Такой страницы нет' :
                  (code == 403 ? 'Доступ запрещён' :
                  (code == 401 ? 'Требуется авторизация' :
                  (code == 400 ? 'Некорректный запрос' :
                  (code &gt;= 500 ? 'Внутренняя ошибка сервера' : 'Что-то пошло не так'))))}">
        Ошибка
    </h1>

    <p class="error-body"
       th:with="code=${status != null ? status : 500}"
       th:text="${code == 404 ? 'Возможно, ссылка устарела или ты свернул не туда. Загляни на главную и продолжи тренировку.' :
                 (code == 403 ? 'Нет прав на это действие. Обнови страницу и повтори; если снова отказ — проверь admin-токен в настройках или войди заново.' :
                 (code == 401 ? 'Нужно представиться, чтобы продолжить.' :
                 (code == 400 ? 'Запрос составлен неверно — проверь введённые данные и попробуй ещё раз.' :
                  'Запрос не дошёл до результата. Попробуй обновить страницу или вернуться на главную — если повторится, посмотри в логи приложения.')))}">
        Что-то пошло не так
    </p>

    <details class="error-details" th:if="${message != null and !#strings.isEmpty(message)} or ${path != null}">
        <summary>Подробности для разработчика</summary>
        <dl class="error-meta">
            <dt th:if="${path != null}">Путь</dt>
            <dd th:if="${path != null}"><code th:text="${path}">/</code></dd>
            <dt th:if="${status != null}">HTTP-статус</dt>
            <dd th:if="${status != null}" th:text="${status}">500</dd>
            <dt th:if="${error != null}">Причина</dt>
            <dd th:if="${error != null}" th:text="${error}">Internal Server Error</dd>
            <dt th:if="${message != null and !#strings.isEmpty(message)}">Сообщение</dt>
            <dd th:if="${message != null and !#strings.isEmpty(message)}"><code th:text="${message}">—</code></dd>
            <dt th:if="${timestamp != null}">Время</dt>
            <dd th:if="${timestamp != null}" th:text="${timestamp}">—</dd>
        </dl>
    </details>

    <nav class="error-actions" aria-label="Что дальше">
        <a th:href="@{/}" class="btn next-btn">На главную</a>
        <!--/* multiSecurityMode может быть null на /error вне ControllerAdvice —
             сравниваем с true, иначе SpEL EL1001E (null→boolean) валит весь error.html. */-->
        <a th:if="${multiSecurityMode == true and status != null and (status == 401 or status == 403)}"
           th:href="@{/login}" class="btn next-btn">Войти</a>
        <a th:href="@{/stats}" class="btn secondary-btn">Аналитика</a>
        <a th:href="@{/settings}" class="btn secondary-btn">Настроить сессию</a>
    </nav>
</section>
</main>
    </div>
</div>
<nav th:replace="~{fragments/mobile-nav :: mobile-nav(active='focus')}"></nav>
<th:block th:replace="~{fragments/shell-scripts :: shell-scripts}"></th:block>
<th:block th:replace="~{fragments/scripts :: app-script}"></th:block>
</body>
</html>
