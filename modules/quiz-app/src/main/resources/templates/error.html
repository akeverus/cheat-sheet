<!DOCTYPE html>
<html lang="ru" data-design="folio" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Ошибка — Подготовка к собеседованию', includeMermaid=false, includeChart=false, includeHighlight=false, page='error')}"></head>
<body class="error-page">
<a class="skip-link" href="#main-content">Перейти к сообщению</a>
<svg th:replace="~{fragments/icons :: sprite}"></svg>
<div class="app">
    <aside th:replace="~{fragments/sidebar :: sidebar(active=${null})}"></aside>
    <div class="shell-main">
        <th:block th:replace="~{fragments/shell-head :: shell-head}"></th:block>
        <main id="main-content" class="ed-page page-canvas" tabindex="-1">
            <section class="error-card" aria-labelledby="error-heading"
                     th:with="code=${status != null ? status : 500}">
                <div class="error-statement">
                    <p class="error-eyebrow">Не удалось открыть страницу <span th:text="'· ' + ${code}">· 500</span></p>
                    <h1 id="error-heading" class="error-title"
                        th:text="${code == 404 ? 'Такой страницы нет' :
                                  (code == 403 ? 'Доступ запрещён' :
                                  (code == 401 ? 'Нужно войти' :
                                  (code == 400 ? 'Не удалось принять запрос' :
                                  (code &gt;= 500 ? 'Сервис временно недоступен' : 'Не удалось выполнить действие'))))}">Не удалось открыть страницу</h1>
                    <p class="error-body"
                       th:text="${code == 404 ? 'Ссылка могла устареть. Открой главную или найди нужный материал в каталоге тем.' :
                                 (code == 403 ? 'Для этого действия у текущей учётной записи нет доступа. Вернись к подготовке или войди с подходящей учётной записью.' :
                                 (code == 401 ? 'Войди в свою учётную запись, чтобы продолжить подготовку.' :
                                 (code == 400 ? 'Проверь введённые данные на предыдущей странице и повтори отправку.' :
                                  'Не удалось завершить запрос. Попробуй вернуться к подготовке через некоторое время. Если ошибка повторится, сохрани идентификатор запроса ниже.')))}">Попробуй позже.</p>
                    <nav class="error-actions" aria-label="Что дальше">
                        <a th:if="${multiSecurityMode == true and (code == 401 or code == 403)}"
                           th:href="@{/login}" class="btn next-btn primary-btn">Войти</a>
                        <a th:unless="${multiSecurityMode == true and (code == 401 or code == 403)}"
                           th:href="@{/}" class="btn next-btn primary-btn">На главную</a>
                        <a th:href="@{/topics}" class="btn secondary-btn">Каталог тем</a>
                    </nav>
                </div>
                <details class="error-dossier" th:if="${correlationId != null or errorTime != null}">
                    <summary class="disclosure-summary"><span>Сведения для обращения</span></summary>
                    <dl class="error-meta">
                        <dt>Код ответа</dt><dd th:text="${code}">500</dd>
                        <dt th:if="${errorTime != null}">Время</dt>
                        <dd th:if="${errorTime != null}" th:text="${errorTime}">—</dd>
                        <dt th:if="${correlationId != null}">Идентификатор запроса</dt>
                        <dd th:if="${correlationId != null}"><code th:text="${correlationId}">—</code></dd>
                    </dl>
                    <p class="error-dossier-note">Эти сведения помогут найти причину ошибки.</p>
                </details>
            </section>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/mobile-nav :: mobile-nav(active=${null})}"></nav>
<th:block th:replace="~{fragments/scripts :: app-script}"></th:block>
</body>
</html>
