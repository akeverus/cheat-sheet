<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Pixel-art спрайт ПРОДУКТОВЫХ СОСТОЯНИЙ (GFX-008, PIXEL_ART_CONTRACT_V2).
  Отдельный от functional-Lucide-спрайта (fragments/icons.html): здесь
  pixel-art hero-глифы на сетке 16×16 (1 unit = 1 пиксель, модуль 2px при
  рендере ×2=32px / ×3=48px — целочисленный scale, без дробного).
  Монохром через currentColor: цвет задаёт .px-illus (base.css) — глифы
  одинаковы в light/dark и наследуют muted-тон (декоративная роль, не
  конкурируют с контентом; контракт 80/15/5).

  Символы (8): px-offline, px-diagram-error (сбой связи и сбой рендера
  диаграммы) + px-portcullis, px-chest, px-spyglass, px-shelf, px-chronicle,
  px-clean-slate — по одному на каждое ПОЛОЖЕНИЕ пустого состояния.

  Спрайт не склад: глиф, на который не ссылается ни один шаблон, удаляется
  вместе с последней ссылкой. Так ушли px-empty-chart, px-sync и
  px-revision-conflict — два последних не использовались ни разу, а первый
  вытеснен словарём ниже. Держит это гейтом StateIllustrationContractTest.

  iter-83. px-portcullis/px-chest/px-spyglass добавлены не ради ассортимента,
  а чтобы пустое состояние заговорило ОДНИМ языком. До них один и тот же смысл «здесь пока
  ничего нет» рисовали три разных источника: PNG-маскот 72px на экране
  вопроса, Lucide-иконка 28px на закладках и глиф этого спрайта 64px в
  аналитике. Три языка на одном понятии — это не разнообразие, а отсутствие
  системы (§24). Смысл каждого глифа привязан к ПОЛОЖЕНИЮ, а не к странице:
    px-portcullis — путь закрыт, идти пока некуда («вопросов нет»);
    px-chest      — хранилище пусто, его ещё предстоит наполнить («нет закладок»);
    px-spyglass   — искали и не нашли; коллекция не пуста, её сузил отбор.
  Поэтому «ничего не нашлось» на закладках и в аналитике берут ОДИН глиф:
  положение одно, страницы разные.
  Использование: <svg class="px-illus" aria-hidden="true"><use href="#px-…"></use></svg>
  (иллюстрация ДЕКОРАТИВНА — рядом всегда есть текстовое сообщение состояния,
  поэтому aria-hidden; смысл несёт текст, не глиф — WCAG 1.1.1/1.4.1).
  Габариты зануляются .icon-sprite (как у icons.html): спрайт = определения.
*/-->
<svg th:fragment="sprite" class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="px-offline" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="5" y="3" width="4" height="1"/><rect x="3" y="4" width="5" height="1"/><rect x="10" y="4" width="2" height="1"/><rect x="2" y="5" width="5" height="1"/><rect x="9" y="5" width="4" height="1"/><rect x="1" y="6" width="5" height="1"/><rect x="8" y="6" width="6" height="1"/><rect x="1" y="7" width="4" height="1"/><rect x="7" y="7" width="7" height="1"/><rect x="1" y="8" width="3" height="1"/><rect x="6" y="8" width="8" height="1"/><rect x="2" y="9" width="1" height="1"/><rect x="5" y="9" width="8" height="1"/></g></symbol>
    <symbol id="px-diagram-error" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="3" y="1" width="6" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="3" y="4" width="6" height="1"/><rect x="5" y="5" width="2" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="4" y="7" width="3" height="1"/><rect x="6" y="8" width="3" height="1"/><rect x="7" y="9" width="1" height="1"/><rect x="3" y="10" width="6" height="1"/><rect x="3" y="11" width="1" height="1"/><rect x="8" y="11" width="1" height="1"/><rect x="3" y="12" width="6" height="1"/></g></symbol>
    <!--/* Опущенная решётка ворот: путь закрыт. Стены x=3/x=12, два прутa x=6/x=9,
         две поперечины (y=6, y=9), порог по низу. */-->
    <symbol id="px-portcullis" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="6" y="2" width="4" height="1"/><rect x="4" y="3" width="2" height="1"/><rect x="10" y="3" width="2" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/><rect x="12" y="4" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="9" y="5" width="1" height="1"/><rect x="12" y="5" width="1" height="1"/><rect x="3" y="6" width="10" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/><rect x="12" y="7" width="1" height="1"/><rect x="3" y="8" width="1" height="1"/><rect x="6" y="8" width="1" height="1"/><rect x="9" y="8" width="1" height="1"/><rect x="12" y="8" width="1" height="1"/><rect x="3" y="9" width="10" height="1"/><rect x="3" y="10" width="1" height="1"/><rect x="6" y="10" width="1" height="1"/><rect x="9" y="10" width="1" height="1"/><rect x="12" y="10" width="1" height="1"/><rect x="3" y="11" width="1" height="1"/><rect x="6" y="11" width="1" height="1"/><rect x="9" y="11" width="1" height="1"/><rect x="12" y="11" width="1" height="1"/><rect x="2" y="12" width="12" height="1"/></g></symbol>
    <!--/* СЛОВАРЬ ПУСТЫХ СОСТОЯНИЙ РАЗЛИЧАЕТ СИТУАЦИИ. Замер до этих трёх глифов:
         один `px-empty-chart` стоял на пяти разных состояниях — «данных ещё нет»,
         «под отбор ничего не попало», «каталог пуст», «ошибок нет». Принцип
         «два пустых состояния должны отличаться с одного взгляда» в проекте уже
         записан (см. закладки: сундук против подзорной трубы), но на аналитике и
         в каталоге он не соблюдался.

         Глифы нарисованы здесь же, в стиле спрайта (16×16, прямоугольники по
         пикселям, currentColor): внешний пак под это не подошёл — проверенный
         CC0-набор 496 RPG-иконок оказался и не той плотности (34×34), и не того
         словаря (зелья, мечи, монеты), а его провенанс автор сам описывает как
         смену лицензии с CC-BY на PD с удалением производных работ. */-->
    <!--/* Пустая полка библиотеки: каталог пуст — класть было нечего.
         Две доски и стойки, между ними ничего. */-->
    <symbol id="px-shelf" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="1"/><rect x="2" y="3" width="1" height="10"/><rect x="13" y="3" width="1" height="10"/><rect x="2" y="7" width="12" height="1"/><rect x="2" y="12" width="12" height="1"/><rect x="4" y="13" width="1" height="1"/><rect x="11" y="13" width="1" height="1"/></g></symbol>
    <!--/* Чистая хроника: записей ещё нет. Закрытый том с корешком слева и
         обрезом страниц — летопись, которую ещё не начали вести.

         Два варианта до этого проверены на 64px в Chromium 1512×982 и
         отброшены по силуэту, а не по вкусу: прямоугольная рамка со сгибом по
         центру читалась как две створки, а разворот со ступенчатыми кромками —
         как сундук с ручкой (сгиб выступал над кромками страниц). На 16×16
         разворот книги не набирается: у него нет ни одной длинной прямой,
         которую глаз опознаёт с одного взгляда. У закрытого тома она есть —
         корешок. Пропорция портретная (10×12, а не 12×12): квадрат читается
         дверью, книга — нет. */-->
    <symbol id="px-chronicle" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="3" y="2" width="2" height="12"/><rect x="5" y="2" width="8" height="1"/><rect x="5" y="13" width="8" height="1"/><rect x="12" y="3" width="1" height="10"/><rect x="10" y="4" width="1" height="8"/></g></symbol>
    <!--/* Очищенная доска заданий: ошибок нет. Это хороший исход, а не пустота,
         поэтому внутри рамки — отметка «разобрано», а не пустое поле. */-->
    <symbol id="px-clean-slate" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="2" y="3" width="12" height="1"/><rect x="2" y="4" width="1" height="8"/><rect x="13" y="4" width="1" height="8"/><rect x="2" y="12" width="12" height="1"/><rect x="5" y="8" width="1" height="1"/><rect x="6" y="9" width="1" height="1"/><rect x="7" y="8" width="1" height="1"/><rect x="8" y="7" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/><rect x="10" y="5" width="1" height="1"/></g></symbol>
    <!--/* Сундук с закрытой крышкой и накладкой замка: хранилище пусто. */-->
    <symbol id="px-chest" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="3" y="2" width="10" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="13" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="13" y="4" width="1" height="1"/><rect x="2" y="5" width="12" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="7" y="6" width="2" height="1"/><rect x="13" y="6" width="1" height="1"/><rect x="2" y="7" width="1" height="1"/><rect x="7" y="7" width="2" height="1"/><rect x="13" y="7" width="1" height="1"/><rect x="2" y="8" width="1" height="1"/><rect x="13" y="8" width="1" height="1"/><rect x="2" y="9" width="1" height="1"/><rect x="13" y="9" width="1" height="1"/><rect x="2" y="10" width="1" height="1"/><rect x="13" y="10" width="1" height="1"/><rect x="2" y="11" width="12" height="1"/></g></symbol>
    <!--/* Подзорная труба: искали и не нашли. Линза 7×7 (x=3..9, y=2..8) плюс
         диагональная ручка — отбор сузил выдачу, а не опустошил хранилище. */-->
    <symbol id="px-spyglass" viewBox="0 0 16 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="5" y="2" width="3" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="9" y="5" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="8" y="7" width="1" height="1"/><rect x="5" y="8" width="3" height="1"/><rect x="9" y="9" width="2" height="1"/><rect x="10" y="10" width="2" height="1"/><rect x="11" y="11" width="2" height="1"/></g></symbol>
</svg>
</body>
</html>
