<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Fragment: today-widget — виджет «Сегодня».
  Стрик догружает quiz/streak.js initStreakBar (multi-instance, по data-streak-bar).
  CTA ведёт в /, где трейнер отдаёт due-вопросы первыми (DefaultSelectionStrategy).

  Числа берём из filteredStats (границы текущего фильтра) с откатом на глобальные
  stats: числитель и знаменатель обязаны быть из одной выборки, иначе получается
  «4 из 9818» — четыре по фильтру, девять тысяч по всей базе.

  Ключевое различие: очередь (due) = повторения + ни разу не открытые вопросы.
  Виджет их не смешивает. На пустом прогрессе весь банк попадает в очередь, и
  общий счётчик обещал бы «9818 к повтору» человеку, который не видел ни одного
  вопроса. Повторять предлагаем только dueRepeats, остальное честно называем новым.

  today-chip(stats)  — компактная строка для /focus (информативная, без CTA —
                       на самой тренировке кнопка «повторить» избыточна).

  Парный фрагмент today-hero(stats) — крупная карточка на /settings — снят в
  iter-62. Он не был «ещё одним видом» тех же данных: все три его факта уже
  стояли на той же странице (стрик в #streak-bar, счётчик к повтору в
  #builder-review-card — там честно по фильтру, запуск в закреплённой панели),
  а его кнопка «Начать повторение» была вторым главным действием страницы и
  уводила мимо конструктора. Контекст страницы теперь несёт общий .page-head.
*/-->

<!--/* Компактный чип для /focus: стрик + очередь, без CTA. */-->
<div th:fragment="today-chip(stats)" class="today-chip" th:if="${stats != null}"
     th:with="scope=${filteredStats != null ? filteredStats : stats},
              repeats=${scope.dueRepeats()}, fresh=${scope.fresh}">
    <!--/* Стрик идёт первым: это личный факт про меня («второй день подряд»), а не
         часть очереди, и он не претендует на подпись соседа. */-->
    <span class="streak-inline hidden" data-streak-bar>
        <svg class="ui-icon" aria-hidden="true"><use href="#flame"></use></svg>
        <span class="streak-inline-days" data-streak-days>0 дней</span>
    </span>
    <!--/* Подпись и число очереди — одна группа, и рвать её переносом нельзя: рельс
         шириной 288px не держит три текстовых элемента в строку, каждый из них
         ломался на две строки, а «Очередь ·» и «фильтр» оказывались на разных.
         Оборачиваем пару в общий контейнер — переносится он целиком, стрик
         остаётся на своей строке.

         Порядок внутри группы: подпись вплотную к числу, которое описывает.
         Раньше подпись открывала строку, а между ней и очередью вклинивался
         стрик — и «Очередь · весь банк» читалась как заголовок к «2 дня».

         Подпись без слова «к повтору»: оно уже стоит в самом значении справа
         («4 из 6 к повтору»), и в одной строке фраза читалась дважды подряд.
         Подпись отвечает на «что это за число», значение — на «сколько»,
         единица остаётся при значении.

         Уточнение границ обязано быть правдой: без фильтра scope — это весь банк,
         и подпись «фильтр» описывала бы то, чего пользователь не задавал.

         Вся группа висит на «есть что показать»: подпись без числа — это ярлык,
         которому нечего называть, и до этой правки при пустой очереди в рельсе
         оставалось одинокое «Очередь · весь банк». */-->
    <span class="today-chip-queue" th:if="${repeats > 0 or fresh > 0}">
        <span class="muted tiny kpi-role"
              th:with="filtered=${(filter != null and filter.narrowed) or weakTopics == true}"
              th:text="${filtered} ? 'Очередь · фильтр' : 'Очередь · весь банк'">Очередь · весь банк</span>
        <!--/* Показываем ведущее число, а не оба: долг важнее запаса, и только когда
             долга нет — счётчик новых. */-->
        <span class="today-chip-due" th:if="${repeats > 0}">
            <svg class="ui-icon" aria-hidden="true"><use href="#target"></use></svg>
            <span th:text="${scope.total > repeats} ? |${repeats} из ${scope.total} к повтору| : |${repeats} к повтору|">0 к повтору</span>
        </span>
        <span class="today-chip-due" th:if="${repeats == 0 and fresh > 0}">
            <svg class="ui-icon" aria-hidden="true"><use href="#target"></use></svg>
            <span th:text="${scope.total > fresh} ? |${fresh} из ${scope.total} новых| : |${fresh} новых|">0 новых</span>
        </span>
    </span>
</div>
</body>
</html>
