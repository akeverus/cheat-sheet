<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="post-answer-controls"
     data-ui-fragment="post-answer-controls">
    <div th:replace="~{fragments/notice :: notice-slot(id='interview-alert', scope='page')}"></div>
    <!--/* WCAG 4.1.3: краткий SR-анонс — только строка вердикта («Ты выбрал… Правильный ответ…»).
         Полный разбор (~2900 симв.: правильный ответ + ключевое отличие + подробнее + дистракторы)
         инъектится в #result-feedback, который НЕ является live-регионом — иначе SR зачитывал бы
         весь блок атомарно (флуд). Вместо этого interview.js переносит focus на #result-feedback,
         и пользователь читает детали в своём темпе. */-->
    <p id="result-announce" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
    <div id="result-feedback" class="result-feedback workspace-surface hidden"></div>
    <!--/* Кнопка «Похожие вопросы» и зона #extra-analysis-content УДАЛЕНЫ (iter-127).
         Похожие вопросы стали третьей вкладкой разбора: прежде они лежали за
         отдельной кнопкой и дописывались ПОД лентой разбора в 1500–3000px, куда
         доскроллить успевали немногие. Одно содержимое — один переключатель;
         вторая кнопка и вторая зона были обходом длины, а не отдельной функцией. */-->
</div>
</body>
</html>
