<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="post-answer-controls(extraButtonText)"
     data-ui-fragment="post-answer-controls">
    <div th:replace="~{fragments/inline-alert :: inline-alert(id='interview-alert', hidden=true)}"></div>
    <div id="result-feedback" class="result-feedback hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <button type="button"
            id="extra-analysis-toggle"
            class="btn secondary-btn hidden"
            aria-controls="extra-analysis-content"
            aria-expanded="false"
            th:text="${extraButtonText}">Показать доп. анализ</button>
    <!-- Контейнер раскрытого «доп. анализа» (takeaway / трейс / похожие вопросы).
         Стоит ПОСЛЕ кнопки-триггера → app.js (appendAnalysisBlock) копит сюда
         раскрытый контент, чтобы он шёл ПОД кнопкой, а не вклинивался между
         фидбэком и кнопкой (иначе триггер-кнопка оставалась сиротой внизу).
         Пустой div невидим; наполняется только после клика «Показать доп. анализ».
         aria-controls кнопки указывает сюда — кнопка раскрывает именно этот блок. -->
    <div id="extra-analysis-content"></div>
</div>
</body>
</html>
