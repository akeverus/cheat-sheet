<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="post-answer-controls(extraButtonText)"
     data-ui-fragment="post-answer-controls">
    <div th:replace="~{fragments/inline-alert :: inline-alert(id='interview-alert', hidden=true)}"></div>
    <!-- WCAG 4.1.3: краткий SR-анонс — только строка вердикта («Ты выбрал… Правильный ответ…»).
         Полный разбор (~2900 симв.: правильный ответ + ключевое отличие + подробнее + дистракторы)
         инъектится в #result-feedback, который НЕ является live-регионом — иначе SR зачитывал бы
         весь блок атомарно (флуд). Вместо этого interview.js переносит focus на #result-feedback,
         и пользователь читает детали в своём темпе. -->
    <p id="result-announce" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
    <div id="result-feedback" class="result-feedback hidden"></div>
    <button type="button"
            id="extra-analysis-toggle"
            class="btn secondary-btn hidden"
            aria-controls="extra-analysis-content"
            aria-expanded="false"
            th:text="${extraButtonText}">Похожие вопросы</button>
    <!-- Контейнер раскрытого «доп. анализа» (takeaway / трейс / похожие вопросы).
         Стоит ПОСЛЕ кнопки-триггера → app.js (appendAnalysisBlock) копит сюда
         раскрытый контент, чтобы он шёл ПОД кнопкой, а не вклинивался между
         фидбэком и кнопкой (иначе триггер-кнопка оставалась сиротой внизу).
         Пустой div невидим; наполняется только после клика «Показать доп. анализ».
         aria-controls кнопки указывает сюда — кнопка раскрывает именно этот блок.
         aria-live=polite: раскрытый по клику контент (takeaway/трейс/похожие)
         объявляется скринридеру — паритет с result-страницей (#result-extra-analysis). -->
    <div id="extra-analysis-content" aria-live="polite"></div>
</div>
</body>
</html>
