<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, includeMermaid, includeChart)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Подготовка к собеседованию</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css(v=10)}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Guard: hljs может не подгрузиться (CSP, offline) — оставляем код без подсветки, без падения.
            if (typeof hljs === 'undefined') return;
            document.querySelectorAll('.markdown-content pre code').forEach(function(b) { hljs.highlightElement(b); });
        });
    </script>
    <th:block th:if="${includeMermaid}">
        <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
        <script th:replace="~{fragments/mermaid-init :: mermaid-init}"></script>
    </th:block>
    <th:block th:if="${includeChart}">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </th:block>
</head>
</html>
