<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, includeMermaid, includeChart)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP nonce for scripts + dynamically injected <style> (Mermaid/hljs). -->
    <meta name="csp-nonce" th:content="${cspNonce}">
    <!-- Цвет браузерного chrome для мобильных (Android Chrome, iOS Safari). -->
    <meta name="theme-color" content="#071116">
    <meta name="color-scheme" content="dark light">
    <!-- FOUC bootstrap: только theme / pixel / motion (+ маркеры JS/settings-tab).
         Layout, reading-width, density, fontScale — settings/personalization-bootstrap.js -->
    <script th:attr="nonce=${cspNonce}">
      (function () {
        // Stamp CSP nonce on createElement('style') so Mermaid/hljs work without style unsafe-inline.
        (function installStyleNonce() {
          var meta = document.querySelector('meta[name="csp-nonce"]');
          var nonce = meta && meta.getAttribute('content');
          if (!nonce) return;
          function stamp(node) {
            if (!node || node.nodeType !== 1) return;
            if (node.tagName === 'STYLE' && !node.getAttribute('nonce')) {
              node.setAttribute('nonce', nonce);
            }
            if (node.querySelectorAll) {
              node.querySelectorAll('style:not([nonce])').forEach(function (el) {
                el.setAttribute('nonce', nonce);
              });
            }
          }
          var createElement = Document.prototype.createElement;
          Document.prototype.createElement = function (tagName, options) {
            var el = createElement.call(this, tagName, options);
            if (String(tagName).toLowerCase() === 'style') stamp(el);
            return el;
          };
          if (typeof MutationObserver !== 'undefined') {
            new MutationObserver(function (records) {
              for (var i = 0; i < records.length; i++) {
                var nodes = records[i].addedNodes;
                for (var j = 0; j < nodes.length; j++) stamp(nodes[j]);
              }
            }).observe(document.documentElement, { childList: true, subtree: true });
          }
        })();
        var root = document.documentElement;
        function metaEl() { return document.querySelector('meta[name="theme-color"]'); }
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
        function systemTheme() { return (mq && mq.matches) ? 'light' : 'dark'; }
        var THEME_COLORS = { light: '#f5f8f8', dark: '#071116' };
        root.setAttribute('data-design', 'instrument');
        root.setAttribute('data-js', '');
        try {
          var st = localStorage.getItem('settingsTab');
          if (st === 'tab-session' || st === 'tab-appearance' || st === 'tab-data') {
            root.setAttribute('data-settings-tab', st);
          }
        } catch (e) { /* приватный режим */ }
        function metaColor(resolved) { return THEME_COLORS[resolved] || THEME_COLORS.dark; }
        function readPref() {
          try {
            var p = localStorage.getItem('theme');
            return (p === 'light' || p === 'dark' || p === 'auto') ? p : 'dark';
          } catch (e) { return 'dark'; }
        }
        function resolve(pref) { return pref === 'auto' ? systemTheme() : pref; }
        function applyResolved(resolved) {
          root.setAttribute('data-theme', resolved);
          var m = metaEl(); if (m) m.setAttribute('content', metaColor(resolved));
        }
        var pref = readPref();
        applyResolved(resolve(pref));
        function notifyTheme() {
          try { document.dispatchEvent(new CustomEvent('themechange', { detail: { pref: pref, resolved: root.getAttribute('data-theme') } })); } catch (e) {}
        }
        function setPref(next) {
          pref = (next === 'light' || next === 'dark' || next === 'auto') ? next : 'auto';
          try { localStorage.setItem('theme', pref); } catch (e) {}
          applyResolved(resolve(pref));
          notifyTheme();
        }
        if (mq) {
          var onSysChange = function () { if (pref === 'auto') { applyResolved(systemTheme()); notifyTheme(); } };
          if (mq.addEventListener) mq.addEventListener('change', onSysChange);
          else if (mq.addListener) mq.addListener(onSysChange);
        }
        window.__theme = {
          pref: function () { return pref; },
          resolved: function () { return root.getAttribute('data-theme'); },
          set: setPref,
          toggle: function () { setPref(resolve(pref) === 'light' ? 'dark' : 'light'); }
        };
        var MOTIONS = ['auto', 'on', 'off'];
        function readMotion() {
          try { var m = localStorage.getItem('motion'); return MOTIONS.indexOf(m) >= 0 ? m : 'auto'; }
          catch (e) { return 'auto'; }
        }
        var motion = readMotion();
        function applyMotion(m) {
          if (m === 'auto') root.removeAttribute('data-motion');
          else root.setAttribute('data-motion', m);
        }
        applyMotion(motion);
        function setMotion(next) {
          motion = (MOTIONS.indexOf(next) >= 0) ? next : 'auto';
          try { if (motion === 'auto') localStorage.removeItem('motion'); else localStorage.setItem('motion', motion); } catch (e) {}
          applyMotion(motion);
          try { document.dispatchEvent(new CustomEvent('motionchange', { detail: { motion: motion } })); } catch (e) {}
        }
        window.__motion = {
          current: function () { return motion; },
          list: MOTIONS.slice(),
          set: setMotion
        };
        var PIXEL_LEVELS = ['low', 'med', 'high'];
        function readPixelIntensity() {
          try {
            var p = localStorage.getItem('pixelIntensity');
            return PIXEL_LEVELS.indexOf(p) >= 0 ? p : 'med';
          } catch (e) { return 'med'; }
        }
        var pixelIntensity = readPixelIntensity();
        root.setAttribute('data-pixel', pixelIntensity);
        function setPixelIntensity(next) {
          pixelIntensity = (PIXEL_LEVELS.indexOf(next) >= 0) ? next : 'med';
          try {
            if (pixelIntensity === 'med') localStorage.removeItem('pixelIntensity');
            else localStorage.setItem('pixelIntensity', pixelIntensity);
          } catch (e) {}
          root.setAttribute('data-pixel', pixelIntensity);
          try {
            document.dispatchEvent(new CustomEvent('pixelintensitychange', { detail: { pixelIntensity: pixelIntensity } }));
          } catch (e) {}
        }
        window.__pixelIntensity = {
          current: function () { return pixelIntensity; },
          list: PIXEL_LEVELS.slice(),
          set: setPixelIntensity
        };
      })();
    </script>
    <!-- Приложение — личная подготовка к интервью, не public web-site:
         запрещаем индексацию поисковиками, чтобы случайный публичный деплой
         не светил вопросы/ответы в Google. Снимай если нужен SEO. -->
    <meta name="robots" content="noindex,nofollow">
    <!-- SVG favicon как /favicon.svg (static resource). Без него браузер делал
         фоновый запрос /favicon.ico → 404 в access logs. SVG-файл вместо
         data: URL — для совместимости с CSP default-src 'self'. -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <title th:text="${title}">Подготовка к собеседованию</title>
    <!-- OPS-005: Inter + JetBrains Mono self-hosted (static/fonts + css/fonts-local.css).
         Семейства совпадают с --font-family-* в tokens.css; pixel-слой body не подменяет. -->
    <link rel="stylesheet" th:href="@{/css/fonts-local.css}">
    <!-- Cascade layers (Wave C): tokens → reset → shell → components → pages →
         utilities → pixel. Порядок <link> = порядок внутри слоя; @layer в
         tokens.css задаёт приоритет слоёв. Structural CSS split из бывшего
         monolith base.css; агрегатор base.css (@import) — для dev-only. -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/reset.css}">
    <link rel="stylesheet" th:href="@{/css/utilities-core.css}">
    <link rel="stylesheet" th:href="@{/css/reset-layout.css}">
    <link rel="stylesheet" th:href="@{/css/components-masthead.css}">
    <link rel="stylesheet" th:href="@{/css/components-controls.css}">
    <link rel="stylesheet" th:href="@{/css/pages-focus.css}">
    <link rel="stylesheet" th:href="@{/css/pages-settings.css}">
    <link rel="stylesheet" th:href="@{/css/pages-stats.css}">
    <link rel="stylesheet" th:href="@{/css/pages-bookmarks.css}">
    <link rel="stylesheet" th:href="@{/css/pages-summary.css}">
    <link rel="stylesheet" th:href="@{/css/pages-error.css}">
    <link rel="stylesheet" th:href="@{/css/pages-login.css}">
    <link rel="stylesheet" th:href="@{/css/pages-result.css}">
    <link rel="stylesheet" th:href="@{/css/components-widgets.css}">
    <link rel="stylesheet" th:href="@{/css/pages-layout.css}">
    <link rel="stylesheet" th:href="@{/css/components-signatures.css}">
    <link rel="stylesheet" th:href="@{/css/utilities-overrides.css}">
    <!-- shell.css — AppShell (sidebar/topbar/mobile-nav). @layer shell. -->
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <!-- pixel-fx — @layer pixel: декор/FX; не трогает skip-link и MCQ-grid. -->
    <link rel="stylesheet" th:href="@{/css/pixel-fx.css}">
    <link rel="stylesheet" th:href="@{/css/pixel/sprite-anim.css}">
    <!-- OPS-005: highlight.js 11.9.0 self-hosted. -->
    <link rel="stylesheet" th:href="@{/vendor/hljs/styles/atom-one-dark.min.css}">
    <!-- defer: highlight.js — DOMContentLoaded ниже и app-entry на AJAX-контенте. -->
    <script defer th:src="@{/vendor/hljs/highlight.min.js}" th:attr="nonce=${cspNonce}"></script>
    <script th:attr="nonce=${cspNonce}">
        document.addEventListener('DOMContentLoaded', function() {
            // Guard: hljs может не подгрузиться (CSP, offline) — оставляем код без подсветки, без падения.
            if (typeof hljs === 'undefined') return;
            document.querySelectorAll('.markdown-content pre code').forEach(function(b) { hljs.highlightElement(b); });
        });
    </script>
    <th:block th:if="${includeMermaid}">
        <!-- mermaid 11.12.0 self-hosted (OPS-005). НЕ deferим: mermaid-renderer.js
             инициализирует во время парсинга. securityLevel: 'antiscript'. -->
        <script th:src="@{/vendor/mermaid/mermaid.min.js}" th:attr="nonce=${cspNonce}"></script>
        <script th:replace="~{fragments/mermaid-init :: mermaid-init}"></script>
    </th:block>
    <th:block th:if="${includeChart}">
        <!-- chart.js 4.5.0 UMD self-hosted (OPS-005). defer → Chart готов до DOMContentLoaded. -->
        <script defer th:src="@{/vendor/chart/chart.umd.min.js}" th:attr="nonce=${cspNonce}"></script>
    </th:block>
</head>
</html>
