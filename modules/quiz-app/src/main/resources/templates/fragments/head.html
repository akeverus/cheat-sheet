<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, includeMermaid, includeChart, includeHighlight, page)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--/* CSP nonce for scripts + dynamically injected <style> (Mermaid/hljs). */-->
    <meta name="csp-nonce" th:content="${cspNonce}">
    <!--/* Цвет браузерного chrome для мобильных (Android Chrome, iOS Safari). */-->
    <meta name="theme-color" content="#14120f">
    <meta name="color-scheme" content="dark light">
    <!--/* Версия для модулей, которых не видит шаблонизатор. Относительные
         `import '../core/dom.js'` живут внутри .js, через @{...} не проходят и
         content-hash их не касается; import map переписывает уже РАЗРЕШЁННЫЙ URL,
         поэтому версию получают все 39 модулей, а не три точки входа. Карта в
         HTML (no-store) — правка модуля доезжает со следующей навигацией, что и
         позволяет держать годовой max-age на самой статике. Собирает
         StaticVersionAdvice; без версионирования атрибут null и тега нет.
         Должен стоять ДО первого type="module" — отсюда место в <head>. */-->
    <script type="importmap" th:if="${jsImportMap}" th:attr="nonce=${cspNonce}"
            th:utext="${jsImportMap}"></script>
    <!--/* PERF: модули страницы — одной волной. О существовании core/api-client.js
         браузер узнаёт, только распарсив quiz/streak.js, а о нём — распарсив
         app-entry.js; замер на Slow 4G дал цепочку в шесть RTT и 5,2 с при 181 КБ
         кода. Список считает JsPreloadService: точки входа с гейтами — в
         js-preload-manifest.txt, зависимости берутся обходом самих import'ов.
         Место — сразу за import map: версию накладывает @{...}, тем же механизмом,
         что и в карте, поэтому адреса совпадают байт в байт и preload попадает
         ровно в тот запрос, который потом сделает загрузчик модулей. */-->
    <link rel="modulepreload" th:each="module : ${@jsPreload.pathsFor(page)}" th:href="@{${module}}">
    <!--/* FOUC bootstrap: theme / экранный пресет / motion (+ маркеры JS/settings-tab).
         Ширина чтения и плотность переехали СЮДА вместе с пресетом: обе меняют
         раскладку (мера прозы и шкала отступов), и применять их после первого
         кадра значило показывать перекладку. В personalization-bootstrap.js
         остался только размер шрифта — он не меняет геометрию блоков. */-->
    <script th:attr="nonce=${cspNonce}">
      (function () {
        // Stamp CSP nonce on createElement('style') so Mermaid/hljs work without style unsafe-inline.
        (function installStyleNonce() {
          var meta = document.querySelector('meta[name="csp-nonce"]');
          var nonce = meta && meta.getAttribute('content');
          if (!nonce) return;
          function stamp(node) {
            if (!node || node.nodeType !== 1) return;
            if (node.tagName === 'STYLE' && !node.getAttribute('nonce')) {
              node.setAttribute('nonce', nonce);
            }
            if (node.querySelectorAll) {
              node.querySelectorAll('style:not([nonce])').forEach(function (el) {
                el.setAttribute('nonce', nonce);
              });
            }
          }
          var createElement = Document.prototype.createElement;
          Document.prototype.createElement = function (tagName, options) {
            var el = createElement.call(this, tagName, options);
            if (String(tagName).toLowerCase() === 'style') stamp(el);
            return el;
          };
          if (typeof MutationObserver !== 'undefined') {
            new MutationObserver(function (records) {
              for (var i = 0; i < records.length; i++) {
                var nodes = records[i].addedNodes;
                for (var j = 0; j < nodes.length; j++) stamp(nodes[j]);
              }
            }).observe(document.documentElement, { childList: true, subtree: true });
          }
        })();
        var root = document.documentElement;
        function metaEl() { return document.querySelector('meta[name="theme-color"]'); }
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
        function systemTheme() { return (mq && mq.matches) ? 'light' : 'dark'; }
        // Цвет хрома браузера = канва темы. Значения снятого направления
        // (#071116 / #f5f8f8) пережили смену палитры: строка адреса на
        // мобильных оставалась сине-зелёной над тёплой страницей.
        var THEME_COLORS = { light: '#ece4d3', dark: '#14120f' };
        root.setAttribute('data-design', 'instrument');
        root.setAttribute('data-js', '');
        // Запомненная вкладка — ДО первого кадра (iter-80). Раньше здесь читался
        // один ключ 'settingsTab', и его значение разбирали четыре CSS-правила по
        // ID панелей настроек: механизм работал ровно на одной странице.
        // Теперь tablist.js кладёт под ключом 'tabPanel:<область>' ID ПАНЕЛИ, а
        // мы пишем по правилу на каждую запомненную панель. `:has()` делает
        // правило самоприцельным: на странице, где такой панели нет, оно не
        // матчит ничего. Если браузер `:has()` не знает — селектор невалиден,
        // правило отбрасывается, и остаётся базовое поведение (открыта панель,
        // помеченная сервером), то есть максимум одна подмена панели после
        // загрузки модуля вместо стопки.
        try {
          var rules = '';
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (!key || key.indexOf('tabPanel:') !== 0) continue;
            var id = localStorage.getItem(key);
            if (!/^[A-Za-z][A-Za-z0-9_-]*$/.test(id || '')) continue;
            rules += 'html[data-design][data-js]:has(#' + id + ') [role="tabpanel"]:not(#' + id + '){display:none}'
                   + 'html[data-design][data-js]:has(#' + id + ') #' + id + '{display:block}';
          }
          if (rules) {
            var tabStyle = document.createElement('style');
            // ID обязателен: ui/tablist.js СНИМАЕТ этот стиль, когда модуль
            // взял управление панелями. Без снятия правило с ID-специфичностью
            // (:has(#панель)) переживало клики и пиннило сохранённую панель на
            // всю жизнь страницы — вкладки «меняли» классы, но не контент
            // (VIS-02: «Динамика» открывалась только после перезагрузки).
            tabStyle.id = 'tab-restore-style';
            tabStyle.textContent = rules;
            document.head.appendChild(tabStyle);
          }
        } catch (e) { /* приватный режим */ }
        function metaColor(resolved) { return THEME_COLORS[resolved] || THEME_COLORS.dark; }
        function readPref() {
          try {
            var p = localStorage.getItem('theme');
            return (p === 'light' || p === 'dark' || p === 'auto') ? p : 'dark';
          } catch (e) { return 'dark'; }
        }
        function resolve(pref) { return pref === 'auto' ? systemTheme() : pref; }
        function applyResolved(resolved) {
          root.setAttribute('data-theme', resolved);
          var m = metaEl(); if (m) m.setAttribute('content', metaColor(resolved));
        }
        var pref = readPref();
        applyResolved(resolve(pref));
        function notifyTheme() {
          try { document.dispatchEvent(new CustomEvent('themechange', { detail: { pref: pref, resolved: root.getAttribute('data-theme') } })); } catch (e) {}
        }
        function setPref(next) {
          pref = (next === 'light' || next === 'dark' || next === 'auto') ? next : 'auto';
          try { localStorage.setItem('theme', pref); } catch (e) {}
          applyResolved(resolve(pref));
          notifyTheme();
        }
        if (mq) {
          var onSysChange = function () { if (pref === 'auto') { applyResolved(systemTheme()); notifyTheme(); } };
          if (mq.addEventListener) mq.addEventListener('change', onSysChange);
          else if (mq.addListener) mq.addListener(onSysChange);
        }
        window.__theme = {
          pref: function () { return pref; },
          resolved: function () { return root.getAttribute('data-theme'); },
          set: setPref,
          toggle: function () { setPref(resolve(pref) === 'light' ? 'dark' : 'light'); }
        };
        var MOTIONS = ['auto', 'on', 'off'];
        var motionMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
        function systemReduced() { return !!(motionMq && motionMq.matches); }
        function readMotion() {
          try { var m = localStorage.getItem('motion'); return MOTIONS.indexOf(m) >= 0 ? m : 'auto'; }
          catch (e) { return 'auto'; }
        }
        var motion = readMotion();
        function applyMotion(m) {
          if (m === 'auto') root.removeAttribute('data-motion');
          else root.setAttribute('data-motion', m);
        }
        applyMotion(motion);
        function notifyMotion() {
          try {
            document.dispatchEvent(new CustomEvent('motionchange', {
              detail: { motion: motion, reduced: motion === 'auto' ? systemReduced() : motion === 'off' }
            }));
          } catch (e) {}
        }
        function setMotion(next) {
          motion = (MOTIONS.indexOf(next) >= 0) ? next : 'auto';
          try { if (motion === 'auto') localStorage.removeItem('motion'); else localStorage.setItem('motion', motion); } catch (e) {}
          applyMotion(motion);
          notifyMotion();
        }
        /* Ось «движение» в режиме auto решается системной настройкой — значит на её
           смену надо реагировать так же, как на смену системной темы выше. CSS-медиа
           перерисуется сам, а JS-потребители (pixel-fx, графики) читают
           prefers-reduced-motion вживую, но узнают о смене только из motionchange:
           без этой подписки они остаются с решением, принятым на загрузке. */
        if (motionMq) {
          var onMotionSysChange = function () { if (motion === 'auto') notifyMotion(); };
          if (motionMq.addEventListener) motionMq.addEventListener('change', onMotionSysChange);
          else if (motionMq.addListener) motionMq.addListener(onMotionSysChange);
        }
        window.__motion = {
          current: function () { return motion; },
          list: MOTIONS.slice(),
          reduced: function () { return motion === 'auto' ? systemReduced() : motion === 'off'; },
          set: setMotion
        };
        /* ЭКРАННЫЙ ПРЕСЕТ вместо трёх отдельных «вкусовых» осей.

           Было шесть переключателей: тема, размер шрифта, ширина чтения,
           плотность, движение, пиксель-эффекты. Три из них — ширина, плотность и
           пиксель — не про доступность, а про то, НА ЧЁМ человек работает, и по
           отдельности давали 2×2×3 = 12 сочетаний, которые никто никогда не
           проверял; сами tokens.css называли две из этих осей legacy и обещали
           удалить. Теперь их выбирает один вопрос — «под какой экран», — а
           доступность (тема, размер текста, движение) осталась отдельными осями,
           как и просил инвариант 2.

           Таблица живёт ЗДЕСЬ, в единственном месте, где она нужна до первой
           отрисовки: плотность меняет шкалу отступов, то есть раскладку, и
           применять её после первого кадра значило бы показывать перекладку.

           «Ноутбук» — значение по умолчанию, и оно даёт РОВНО прежний вид
           (просторные отступы, мера 72ch, средняя пиксель-интенсивность): смена
           умолчания перерисовала бы приложение всем, кто настройки не открывал. */
        var SCREEN_PRESETS = {
          phone:  { density: 'compact',  readingWidth: 'standard', pixel: 'low' },
          laptop: { density: 'spacious', readingWidth: 'standard', pixel: 'med' },
          wide:   { density: 'spacious', readingWidth: 'wide',     pixel: 'high' }
        };
        var PRESET_NAMES = ['phone', 'laptop', 'wide'];
        function migrateLegacyPreset() {
          /* Прежние ключи хранились по одной оси. Тем, кто их настраивал, отдаём
             ближайший пресет, а не молча сбрасываем выбор: компактные отступы —
             это «телефон», широкая мера — «большой монитор». Ключи после переноса
             удаляем, чтобы вторая система хранения не пережила первую. */
          try {
            var legacyDensity = localStorage.getItem('density');
            var legacyWidth = localStorage.getItem('readingWidth');
            var legacyPixel = localStorage.getItem('pixelIntensity');
            if (!legacyDensity && !legacyWidth && !legacyPixel) return null;
            /* Пиксельность участвует в выборе: тот, кто настраивал ТОЛЬКО её,
               иначе молча получал laptop/med — его единственный выбор пропадал
               (нашлось visual-матрицей: pixelIntensity=low давал data-pixel=med).
               Оси раскладки сильнее: явные compact/wide решают первыми. */
            var guess = legacyDensity === 'compact' ? 'phone'
              : (legacyWidth === 'wide' ? 'wide'
              : (legacyPixel === 'low' ? 'phone'
              : (legacyPixel === 'high' ? 'wide' : 'laptop')));
            localStorage.removeItem('density');
            localStorage.removeItem('readingWidth');
            localStorage.removeItem('pixelIntensity');
            localStorage.setItem('screenPreset', guess);
            return guess;
          } catch (e) { return null; }
        }
        function readScreenPreset() {
          try {
            var p = localStorage.getItem('screenPreset');
            if (PRESET_NAMES.indexOf(p) >= 0) return p;
          } catch (e) { return 'laptop'; }
          return migrateLegacyPreset() || 'laptop';
        }
        var screenPreset = readScreenPreset();
        function applyScreenPreset(name) {
          var cfg = SCREEN_PRESETS[name] || SCREEN_PRESETS.laptop;
          if (cfg.density === 'spacious') root.removeAttribute('data-density');
          else root.setAttribute('data-density', cfg.density);
          if (cfg.readingWidth === 'standard') root.removeAttribute('data-reading-width');
          else root.setAttribute('data-reading-width', cfg.readingWidth);
          root.setAttribute('data-pixel', cfg.pixel);
        }
        applyScreenPreset(screenPreset);
        function setScreenPreset(next) {
          screenPreset = (PRESET_NAMES.indexOf(next) >= 0) ? next : 'laptop';
          try {
            if (screenPreset === 'laptop') localStorage.removeItem('screenPreset');
            else localStorage.setItem('screenPreset', screenPreset);
          } catch (e) {}
          applyScreenPreset(screenPreset);
          try {
            document.dispatchEvent(new CustomEvent('screenpresetchange', { detail: { screenPreset: screenPreset } }));
          } catch (e) {}
        }
        window.__screenPreset = {
          current: function () { return screenPreset; },
          list: PRESET_NAMES.slice(),
          set: setScreenPreset
        };
      })();
    </script>
    <!--/* Приложение — личная подготовка к интервью, не public web-site:
         запрещаем индексацию поисковиками, чтобы случайный публичный деплой
         не светил вопросы/ответы в Google. Снимай если нужен SEO. */-->
    <meta name="robots" content="noindex,nofollow">
    <!--/* Description — не для поисковиков (noindex стоит нарочно: локальный
         приватный инструмент), а для закладок браузера и превью при шеринге
         ссылки: без него превью показывает случайный срез разметки. Один
         дефолт на все страницы — различает их title (FRD-220). */-->
    <meta name="description" content="Тренажёр подготовки к техническим собеседованиям: вопросы по Java, Kotlin, Go, Spring, базам данных и архитектуре — восемь режимов, интервальные повторения, аналитика прогресса.">
    <!--/* SVG favicon как /favicon.svg (static resource). Без него браузер делал
         фоновый запрос /favicon.ico → 404 в access logs. SVG-файл вместо
         data: URL — для совместимости с CSP default-src 'self'. */-->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <title th:text="${title}">Подготовка к собеседованию</title>
    <!--/* OPS-005: Literata + Inter + JetBrains Mono self-hosted (static/fonts + css/fonts-local.css).
         Семейства совпадают с --font-family-* в tokens.css; pixel-слой body не подменяет. */-->
    <!--/* PERF: один блокирующий CSS-запрос на страницу вместо 33 <link>.
         Порядок каскада и постраничные гейты — в css-bundle-manifest.txt; лента
         склеивается CssBundleService, имя несёт хеш содержимого. Замер на Slow 4G
         до склейки: 33 запроса стартуют одновременно, сериализуются в шесть волн
         HTTP/1.1 и держат FCP на 4,4 с — платили не 130 КБ, а латентность. */-->
    <!--/* Preload критичных шрифтовых субсетов. Замер (iter-177, Slow 4G + CPU 4x):
         woff2 стартовали только ПОСЛЕ парса CSS-бандла — хвост критической цепи
         1793ms (html 889 → бандл 625 → шрифты). Шесть субсетов, без которых не
         рисуется ни одна страница русского UI (основная кириллица И латиница всех
         трёх семейств: латиница нужна коду, терминам и самому «Cheat Sheet»),
         уходят в полёт параллельно бандлу. Первая редакция прелоадила четыре —
         повторный трейс показал латиницу JBMono/Literata всё ещё в хвосте цепи.
         Основная кириллица = U+0400-045F (...SjIa0ZL7W0Q5n-wU), НЕ cyrillic-ext
         U+0460-052F (...SjIa2JL7W0Q5n-wU) — тот почти не используется и дал бы
         unused preload. Имена файлов зашиты — их сверяет с fonts-local.css
         FontPreloadContractTest: протухший preload = двойная загрузка молча.
         Линки создаёт СКРИПТ, а не разметка: для same-origin шрифтов движки
         зеркально расходятся в матчинге preload и @font-face-загрузки (замер
         iter-178, сетевые запросы на 6 файлов): Chromium с crossorigin — 6,
         без — 12; WebKit с crossorigin — 12, без — 6. Любой статический
         вариант атрибута = двойная загрузка каждого woff2 в одном из движков,
         поэтому crossOrigin ветвится по UA. Ошибка классификации будущего UA
         деградирует в двойную загрузку, не в поломку. Без JS preload просто
         нет — шрифты приходят по старой цепи через CSS, цикл невредим. */-->
    <script th:attr="nonce=${cspNonce}" th:inline="javascript">
      (function () {
        var fonts = [
          [[@{/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa0ZL7W0Q5n-wU.woff2}]],
          [[@{/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2}]],
          [[@{/fonts/tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxTcwgknk-6nFg.woff2}]],
          [[@{/fonts/tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxDcwgknk-4.woff2}]],
          [[@{/fonts/or3PQ6P12-iJxAIgLa78DkTtAoDhk0oVpaK3YLanFLHpPf2TbLi4J_XWTEKVt8m1ow.woff2}]],
          [[@{/fonts/or3PQ6P12-iJxAIgLa78DkTtAoDhk0oVpaK3YLanFLHpPf2TbLi4J_HWTEKVt8k.woff2}]]
        ];
        var safari = /AppleWebKit/.test(navigator.userAgent)
          && !/Chrome|Chromium|Edg\/|OPR\//.test(navigator.userAgent);
        for (var i = 0; i < fonts.length; i++) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'font';
          link.type = 'font/woff2';
          link.href = fonts[i];
          if (!safari) link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
      })();
    </script>
    <link rel="stylesheet" th:href="@{__${@cssBundle.pathFor(page)}__}">
    <!--/* OPS-005: highlight.js 11.9.0 self-hosted. PERF: гейт includeHighlight —
         скрипт hljs (~110 КБ) грузится ТОЛЬКО на страницах с кодом (focus-training/result),
         а не на stats/bookmarks/settings/login/session-summary/error. Как includeMermaid/includeChart.
         Тема — своя, components-code-highlight.css на токенах --code-*; едет внутри
         CSS-ленты с тем же гейтом (css-bundle-manifest.txt).
         Вызов подсветки здесь НЕ дублируется: единственная точка входа —
         highlightPageCodeBlocks() в js/content/highlight.js, её зовёт app-entry.
         defer + module оба исполняются до DOMContentLoaded в порядке документа,
         поэтому hljs уже определён к моменту вызова. */-->
    <th:block th:if="${includeHighlight}">
        <script defer th:src="@{/vendor/hljs/highlight.min.js}" th:attr="nonce=${cspNonce}"></script>
    </th:block>
    <th:block th:if="${includeMermaid}">
        <!--/* mermaid 11.12.0 self-hosted (OPS-005), 2.7 МБ распакованного JS — самый
             тяжёлый ассет приложения. Тега <script> здесь нет намеренно: библиотеку
             подгружает mermaid-renderer.js, когда диаграмма реально попадает в вид.
             Схема живёт во вкладке «Схема», которая по умолчанию закрыта, поэтому
             блокирующая загрузка оплачивала контент, который часто не открывают.
             Путь отдаём через meta, а не строкой в JS: @{...} проходит через
             ResourceUrlProvider и в prod несёт content-hash — знает его только шаблон. */-->
        <meta name="mermaid-src" th:content="@{/vendor/mermaid/mermaid.min.js}">
        <script th:replace="~{fragments/mermaid-init :: mermaid-init}"></script>
    </th:block>
