<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, includeMermaid, includeChart)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Цвет браузерного chrome для мобильных (Android Chrome, iOS Safari). -->
    <meta name="theme-color" content="#16130D">
    <meta name="color-scheme" content="dark light">
    <!-- Тема: ставим data-theme на <html> ДО первого кадра (без вспышки белым).
         Приоритет: сохранённый выбор → системная prefers-color-scheme → dark (бренд).
         Синхронизируем meta[theme-color] под активную тему. Инлайн — осознанно:
         внешний скрипт грузится асинхронно и дал бы FOUC при перезагрузке в light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#F7F3EA' : '#16130D');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- Приложение — личная подготовка к интервью, не public web-site:
         запрещаем индексацию поисковиками, чтобы случайный публичный деплой
         не светил вопросы/ответы в Google. Снимай если нужен SEO. -->
    <meta name="robots" content="noindex,nofollow">
    <!-- SVG favicon как /favicon.svg (static resource). Без него браузер делал
         фоновый запрос /favicon.ico → 404 в access logs. SVG-файл вместо
         data: URL — для совместимости с CSP default-src 'self'. -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <title th:text="${title}">Подготовка к собеседованию</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- DNS-prefetch для CDN-источников, чтобы first-byte highlight.js / mermaid /
         chart.js пришёл быстрее (TCP-handshake идёт параллельно с парсингом HTML). -->
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <!-- Editorial-редизайн: Fraunces (display) + Newsreader (reading) + JetBrains
         Mono (eyebrow/code). Единственный шрифт-линк (Syne/DM Sans убраны на R3). -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
    <!-- editorial.css — единственная таблица стилей (Editorial-редизайн).
         Самодостаточна: reset, типошкала, утилиты, обе темы, reduced-motion.
         Preload — браузер скачивает её параллельно с парсингом head → меньше FOUC. -->
    <link rel="preload" as="style" th:href="@{/css/editorial.css(v=51)}">
    <link rel="stylesheet" th:href="@{/css/editorial.css(v=51)}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Guard: hljs может не подгрузиться (CSP, offline) — оставляем код без подсветки, без падения.
            if (typeof hljs === 'undefined') return;
            document.querySelectorAll('.markdown-content pre code').forEach(function(b) { hljs.highlightElement(b); });
        });
    </script>
    <th:block th:if="${includeMermaid}">
        <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
        <script th:replace="~{fragments/mermaid-init :: mermaid-init}"></script>
    </th:block>
    <th:block th:if="${includeChart}">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </th:block>
</head>
</html>
