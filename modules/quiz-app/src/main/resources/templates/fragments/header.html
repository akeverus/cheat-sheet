<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Editorial masthead. Сигнатуру фрагмента сохраняем (pageTitle, statsPage,
     activePage, showPrimaryNav) — старые вызовы не ломаются. Навигация теперь
     ЕДИНАЯ и видна всегда (showPrimaryNav больше не гейтит её — конец дубля с
     surface-tabs). theme-toggle (id/aria/скрипт) и progressbar-контракт целы. -->
<header th:fragment="header(pageTitle, statsPage, activePage, showPrimaryNav)" class="ed-masthead">
    <!-- SVG-спрайт иконок: один раз на страницу (header есть везде). -->
    <svg th:replace="~{fragments/icons :: sprite}"></svg>
    <noscript>
        <div class="inline-alert ed-noscript" role="alert">
            <strong>JavaScript отключён.</strong> Без него часть интерактивных элементов
            (раскрытие подсказок, hotkey-навигация, графики на Аналитике) работать не будут.
            Базовый flow (вопрос → ответ → результат) останется доступен через формы.
        </div>
    </noscript>
    <div class="ed-masthead-inner">
        <a class="ed-masthead-brand" th:href="@{/}">
            <span class="ed-eyebrow ed-masthead-kicker">Cheat&nbsp;·&nbsp;Sheet</span>
            <h1 class="ed-masthead-title" th:text="${pageTitle}">Подготовка к собеседованию</h1>
        </a>
        <div class="ed-masthead-actions">
            <nav class="ed-nav" aria-label="Основная навигация">
                <a th:href="@{/}" class="ed-nav-link"
                   th:classappend="${activePage == 'focus'} ? 'is-active'"
                   th:attr="aria-current=${activePage == 'focus'} ? 'page' : null">Фокус</a>
                <a th:href="@{/stats}" class="ed-nav-link"
                   th:classappend="${activePage == 'analytics'} ? 'is-active'"
                   th:attr="aria-current=${activePage == 'analytics'} ? 'page' : null">Аналитика</a>
                <a th:href="@{/settings}" class="ed-nav-link"
                   th:classappend="${activePage == 'settings'} ? 'is-active'"
                   th:attr="aria-current=${activePage == 'settings'} ? 'page' : null">Настройки</a>
            </nav>
            <!-- Экспорт прогресса живёт на /settings → «Управление данными»: единая
                 точка для дата-операций. Раньше здесь дублировались <a href=/export>,
                 которые всегда отдавали raw-JSON 403 (заголовок X-Admin-Token из
                 навигации не отправить) И требовали app.js, не подключённого на /stats.
                 Убрали дубль — шапка чище, экспорт один и рабочий. -->
            <!-- Группа тогглов (дизайн + тема) — обёрнуты вместе, чтобы при переносе
                 на узких экранах не разъезжались по разным строкам (flex-wrap), а
                 всегда оставались парой. На десктопе расстояния не меняются. -->
            <div class="ed-masthead-toggles">
                <!-- Переключатель раскладки: тот же 44px-тоггл. Клик циклит
                     flow→split→grid через window.__layout (head.html). Полный выбор —
                     в «Персонализации» на /settings; обе точки синхронятся событием
                     layoutchange. -->
                <button type="button" class="ed-theme-toggle ed-layout-toggle hidden" id="layout-toggle"
                        aria-label="Сменить раскладку" title="Раскладка страниц">
                    <svg class="ed-icon" aria-hidden="true" focusable="false"><use href="#i-layout"></use></svg>
                </button>
                <!-- Переключатель дизайна: иконка-близнец тоггла темы (та же 44px-оболочка
                     .ed-theme-toggle). Клик циклит по ПОЛНОМУ списку дизайнов
                     window.__design.list (head.html) — не по фиксированной четвёрке;
                     сейчас реестр из 11 (Editorial, Linear, Swiss, Notion, Mintlify,
                     Broadsheet, Superhuman, Stripe, Claude, The Verge, Instrument).
                     Полный выбор —
                     на /settings; обе точки синхронятся событием designchange. -->
                <button type="button" class="ed-theme-toggle ed-design-toggle hidden" id="design-toggle"
                        aria-label="Сменить дизайн" title="Дизайн оформления">
                    <svg class="ed-icon" aria-hidden="true" focusable="false"><use href="#i-shapes"></use></svg>
                </button>
                <button type="button" class="theme-toggle ed-theme-toggle hidden" id="theme-toggle"
                        aria-label="Переключить тему" aria-pressed="false" title="Светлая / тёмная тема">
                    <span class="theme-toggle-icon" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>
    <div class="ed-masthead-progress progress-container" th:if="${progressPercent != null}">
        <div class="progress-bar ed-masthead-progress-fill" th:attr="data-progress=${progressPercent}"></div>
    </div>
    <!-- Переключатель темы: быстрый флип светлая↔тёмная через центральный
         window.__theme (head.html). Полный выбор, включая «Авто», живёт в
         «Персонализации» на /settings; тоггл пере-синхронится по событию
         themechange, чтобы aria/иконка не разъехались с выбранным режимом. -->
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn || !window.__theme) return;
        // PE: тоггл рендерится hidden и раскрывается только здесь — без JS (этот
        // скрипт не выполняется) кнопка не показывается, мёртвого контрола нет.
        btn.classList.remove('hidden');
        function sync() {
          var resolved = window.__theme.resolved();
          var pref = window.__theme.pref();
          btn.setAttribute('aria-pressed', resolved === 'light' ? 'true' : 'false');
          btn.setAttribute('aria-label', resolved === 'light' ? 'Включить тёмную тему' : 'Включить светлую тему');
          btn.setAttribute('title', pref === 'auto'
            ? 'Тема: авто (по системе). Клик — зафиксировать ' + (resolved === 'light' ? 'тёмную' : 'светлую')
            : (resolved === 'light' ? 'Тёмная тема' : 'Светлая тема'));
        }
        sync();
        btn.addEventListener('click', function () { window.__theme.toggle(); });
        document.addEventListener('themechange', sync);
      })();
    </script>
    <!-- Переключатель дизайна: тот же паттерн, что и тоггл темы. Циклит по
         window.__design.list; tooltip/aria называют текущий → следующий дизайн,
         чтобы клик был предсказуем. Пере-синхрон по designchange держит шапку и
         seg-control на /settings в одном состоянии. -->
    <script>
      (function () {
        var btn = document.getElementById('design-toggle');
        if (!btn || !window.__design) return;
        // При единственном дизайне (feature-freeze на Instrument, DEC-002)
        // переключать нечего: раскрытая кнопка осталась бы МЁРТВЫМ фокусируемым
        // контролом в tab-order/a11y-дереве на КАЖДОЙ странице (клик коерсит
        // instrument→instrument, no-op) — keyboard/SR-дефект (A11Y-01, R0.170).
        // Держим её скрытой (class="hidden" = display:none, вне a11y-дерева),
        // если в реестре ≤1 дизайн. Полное удаление узла+скрипта — FE-CMP-1.
        var designList = (window.__design.list && window.__design.list.length) ? window.__design.list : [];
        if (designList.length <= 1) return;
        // PE: см. тоггл темы — раскрываем только при работающем JS.
        btn.classList.remove('hidden');
        var NAMES = { editorial: 'Editorial', linear: 'Linear', swiss: 'Swiss', notion: 'Notion', mintlify: 'Mintlify', broadsheet: 'Broadsheet',
                      superhuman: 'Superhuman', stripe: 'Stripe', claude: 'Claude', theverge: 'The Verge', instrument: 'Instrument' };
        function label(id) { return NAMES[id] || id; }
        function order() {
          var list = window.__design.list;
          return (list && list.length) ? list : ['editorial', 'linear', 'swiss', 'notion', 'mintlify', 'broadsheet',
                                                  'superhuman', 'stripe', 'claude', 'theverge', 'instrument'];
        }
        function nextOf(cur) {
          var list = order();
          var i = list.indexOf(cur);
          return list[(i + 1) % list.length];
        }
        function sync() {
          var cur = window.__design.current();
          btn.setAttribute('aria-label', 'Сменить дизайн (сейчас: ' + label(cur) + ')');
          btn.setAttribute('title', 'Дизайн: ' + label(cur) + ' → ' + label(nextOf(cur)));
        }
        sync();
        btn.addEventListener('click', function () { window.__design.set(nextOf(window.__design.current())); });
        document.addEventListener('designchange', sync);
      })();
    </script>
    <!-- Переключатель раскладки: тот же паттерн, что тогглы темы/дизайна. Циклит
         по window.__layout.list (flow→split→grid); tooltip/aria называют текущую →
         следующую раскладку. Пере-синхрон по layoutchange держит шапку и
         seg-control на /settings в одном состоянии. -->
    <script>
      (function () {
        var btn = document.getElementById('layout-toggle');
        if (!btn || !window.__layout) return;
        // PE: см. тоггл темы — раскрываем только при работающем JS.
        btn.classList.remove('hidden');
        var NAMES = { flow: 'Поток', split: 'Два пейна', grid: 'Сетка' };
        function label(id) { return NAMES[id] || id; }
        function order() {
          var list = window.__layout.list;
          return (list && list.length) ? list : ['flow', 'split', 'grid'];
        }
        function nextOf(cur) {
          var list = order();
          var i = list.indexOf(cur);
          return list[(i + 1) % list.length];
        }
        function sync() {
          var cur = window.__layout.current();
          btn.setAttribute('aria-label', 'Сменить раскладку (сейчас: ' + label(cur) + ')');
          btn.setAttribute('title', 'Раскладка: ' + label(cur) + ' → ' + label(nextOf(cur)));
        }
        sync();
        btn.addEventListener('click', function () { window.__layout.set(nextOf(window.__layout.current())); });
        document.addEventListener('layoutchange', sync);
      })();
    </script>
    <!-- Кнопка «наверх»: инжектится здесь (header есть на КАЖДОЙ странице, в т.ч.
         /stats, где app.js не подключён). PE: без JS кнопки нет — мёртвого контрола
         не остаётся. Появляется только после прокрутки на ~1.5 экрана; скролл
         throttled через rAF; smooth уважает И системную prefers-reduced-motion, И явную
         ось «Движение» (<html data-motion>: off→мгновенно, on→smooth, auto→по системе). -->
    <script>
      (function () {
        if (!document.body) return;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'back-to-top';
        btn.setAttribute('aria-label', 'Наверх');
        btn.setAttribute('title', 'Наверх');
        btn.innerHTML = '<svg class="ed-icon" aria-hidden="true"><use href="#i-arrow-up"></use></svg>';
        document.body.appendChild(btn);
        // Уважает И системную prefers-reduced-motion, И явную ось «Движение»
        // (<html data-motion>): off → всегда мгновенно, on → всегда smooth,
        // auto/нет атрибута → по системе. Читаем на каждый клик — чтобы смена
        // настройки в /settings подхватывалась без перезагрузки.
        function motionReduced() {
          var dm = document.documentElement.getAttribute('data-motion');
          if (dm === 'off') return true;
          if (dm === 'on') return false;
          return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }
        var shown = false, ticking = false;
        function threshold() { return Math.max(400, window.innerHeight * 1.5); }
        function update() {
          ticking = false;
          var should = window.pageYOffset > threshold();
          if (should === shown) return;
          shown = should;
          btn.classList.toggle('is-visible', should);
        }
        window.addEventListener('scroll', function () {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(update);
        }, { passive: true });
        btn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: motionReduced() ? 'auto' : 'smooth' });
          // Фокус на skip-link/первый заголовок — чтобы клавиатура не осталась внизу.
          var anchor = document.getElementById('main-content') || document.querySelector('h1, h2');
          if (anchor && typeof anchor.focus === 'function') {
            anchor.setAttribute('tabindex', '-1');
            anchor.focus({ preventScroll: true });
          }
        });
        update();
      })();
    </script>
</header>
</body>
</html>
