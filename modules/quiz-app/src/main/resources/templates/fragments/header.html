<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Editorial masthead. Сигнатуру фрагмента сохраняем (pageTitle, statsPage,
     activePage, showPrimaryNav) — старые вызовы не ломаются. Навигация теперь
     ЕДИНАЯ и видна всегда (showPrimaryNav больше не гейтит её — конец дубля с
     surface-tabs). theme-toggle (id/aria/скрипт) и progressbar-контракт целы. -->
<header th:fragment="header(pageTitle, statsPage, activePage, showPrimaryNav)" class="ed-masthead">
    <!-- SVG-спрайт иконок: один раз на страницу (header есть везде). -->
    <svg th:replace="~{fragments/icons :: sprite}"></svg>
    <noscript>
        <div class="inline-alert ed-noscript" role="alert">
            <strong>JavaScript отключён.</strong> Без него часть интерактивных элементов
            (раскрытие подсказок, hotkey-навигация, графики на Аналитике) работать не будут.
            Базовый flow (вопрос → ответ → результат) останется доступен через формы.
        </div>
    </noscript>
    <div class="ed-masthead-inner">
        <a class="ed-masthead-brand" th:href="@{/}" style="text-decoration:none">
            <span class="ed-eyebrow ed-masthead-kicker">Cheat&nbsp;·&nbsp;Sheet</span>
            <h1 class="ed-masthead-title" th:text="${pageTitle}">Подготовка к собеседованию</h1>
        </a>
        <div class="ed-masthead-actions">
            <nav class="ed-nav" aria-label="Основная навигация">
                <a th:href="@{/}" class="ed-nav-link"
                   th:classappend="${activePage == 'focus'} ? 'is-active'"
                   th:attr="aria-current=${activePage == 'focus'} ? 'page' : null">Фокус</a>
                <a th:href="@{/stats}" class="ed-nav-link"
                   th:classappend="${activePage == 'analytics'} ? 'is-active'"
                   th:attr="aria-current=${activePage == 'analytics'} ? 'page' : null">Аналитика</a>
                <a th:href="@{/settings}" class="ed-nav-link"
                   th:classappend="${activePage == 'settings'} ? 'is-active'"
                   th:attr="aria-current=${activePage == 'settings'} ? 'page' : null">Настройки</a>
            </nav>
            <!-- Экспорт прогресса живёт на /settings → «Управление данными»: единая
                 точка для дата-операций. Раньше здесь дублировались <a href=/export>,
                 которые всегда отдавали raw-JSON 403 (заголовок X-Admin-Token из
                 навигации не отправить) И требовали app.js, не подключённого на /stats.
                 Убрали дубль — шапка чище, экспорт один и рабочий. -->
            <button type="button" class="theme-toggle ed-theme-toggle" id="theme-toggle"
                    aria-label="Переключить тему" aria-pressed="false" title="Светлая / тёмная тема">
                <span class="theme-toggle-icon" aria-hidden="true"></span>
            </button>
        </div>
    </div>
    <div class="ed-masthead-progress progress-container" th:if="${progressPercent != null}">
        <div class="progress-bar ed-masthead-progress-fill" th:attr="data-progress=${progressPercent}"></div>
    </div>
    <!-- Переключатель темы: меняет data-theme на <html>, пишет выбор в
         localStorage, синхронит aria-pressed и meta[theme-color]. -->
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');
        function sync() {
          var t = root.getAttribute('data-theme') || 'dark';
          btn.setAttribute('aria-pressed', t === 'light' ? 'true' : 'false');
          btn.setAttribute('title', t === 'light' ? 'Тёмная тема' : 'Светлая тема');
          btn.setAttribute('aria-label', t === 'light' ? 'Включить тёмную тему' : 'Включить светлую тему');
        }
        sync();
        btn.addEventListener('click', function () {
          var next = (root.getAttribute('data-theme') === 'light') ? 'dark' : 'light';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          if (meta) meta.setAttribute('content', next === 'light' ? '#F7F3EA' : '#16130D');
          sync();
        });
      })();
    </script>
    <!-- Кнопка «наверх»: инжектится здесь (header есть на КАЖДОЙ странице, в т.ч.
         /stats, где app.js не подключён). PE: без JS кнопки нет — мёртвого контрола
         не остаётся. Появляется только после прокрутки на ~1.5 экрана; скролл
         throttled через rAF; smooth уважает prefers-reduced-motion (берётся из CSS
         scroll-behavior, поэтому используем 'smooth' только когда движение разрешено). -->
    <script>
      (function () {
        if (!document.body) return;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'back-to-top';
        btn.setAttribute('aria-label', 'Наверх');
        btn.setAttribute('title', 'Наверх');
        btn.innerHTML = '<svg class="ed-icon" aria-hidden="true"><use href="#i-arrow-up"></use></svg>';
        document.body.appendChild(btn);
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var shown = false, ticking = false;
        function threshold() { return Math.max(400, window.innerHeight * 1.5); }
        function update() {
          ticking = false;
          var should = window.pageYOffset > threshold();
          if (should === shown) return;
          shown = should;
          btn.classList.toggle('is-visible', should);
        }
        window.addEventListener('scroll', function () {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(update);
        }, { passive: true });
        btn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
          // Фокус на skip-link/первый заголовок — чтобы клавиатура не осталась внизу.
          var anchor = document.getElementById('main-content') || document.querySelector('h1, h2');
          if (anchor && typeof anchor.focus === 'function') {
            anchor.setAttribute('tabindex', '-1');
            anchor.focus({ preventScroll: true });
          }
        });
        update();
      })();
    </script>
</header>
</body>
</html>
