<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="inline-alert(id, hidden)">
    <div th:attr="id=${id}"
         data-ui-fragment="inline-alert"
         th:class="${hidden} ? 'inline-alert hidden' : 'inline-alert'"
         role="alert"
         aria-live="assertive"></div>
</div>
</body>
</html>
