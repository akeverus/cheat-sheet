<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Скрипты shell (редизайн): переносят из прежнего masthead жизненно нужное —
     (1) тоггл темы (все [data-theme-toggle] в sidebar-футере и mobile-header),
     (2) кнопку «наверх». Оба — прогрессивное улучшение: без JS контролы скрыты.
     Включается один раз на страницу (после mobile-nav). -->
<th:block th:fragment="shell-scripts">
    <script>
      (function () {
        function motionReduced() {
          var dm = document.documentElement.getAttribute('data-motion');
          if (dm === 'off') return true;
          if (dm === 'on') return false;
          return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        // ---- Тоггл темы: раскрываем hidden-контролы и синхроним подпись/aria ----
        var toggles = document.querySelectorAll('[data-theme-toggle]');
        if (toggles.length && window.__theme) {
          function sync() {
            var resolved = window.__theme.resolved();
            var toDark = resolved === 'light';
            var label = toDark ? 'Тёмная тема' : 'Светлая тема';
            toggles.forEach(function (btn) {
              btn.classList.remove('hidden');
              btn.setAttribute('aria-pressed', resolved === 'light' ? 'true' : 'false');
              btn.setAttribute('aria-label', 'Включить ' + (toDark ? 'тёмную' : 'светлую') + ' тему');
              var lbl = btn.querySelector('[data-theme-label]');
              if (lbl) lbl.textContent = label;
            });
          }
          sync();
          toggles.forEach(function (btn) {
            btn.addEventListener('click', function () { window.__theme.toggle(); });
          });
          document.addEventListener('themechange', sync);
        }

        // ---- Кнопка «наверх» ----
        if (document.body) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'back-to-top';
          btn.setAttribute('aria-label', 'Наверх');
          btn.setAttribute('title', 'Наверх');
          btn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#arrow"></use></svg>';
          document.body.appendChild(btn);
          var shown = false, ticking = false;
          function threshold() { return Math.max(400, window.innerHeight * 1.5); }
          function update() {
            ticking = false;
            var should = window.pageYOffset > threshold();
            if (should === shown) return;
            shown = should;
            btn.classList.toggle('is-visible', should);
          }
          window.addEventListener('scroll', function () {
            if (ticking) return;
            ticking = true;
            window.requestAnimationFrame(update);
          }, { passive: true });
          btn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: motionReduced() ? 'auto' : 'smooth' });
            var anchor = document.getElementById('main-content') || document.querySelector('h1, h2');
            if (anchor && typeof anchor.focus === 'function') {
              anchor.setAttribute('tabindex', '-1');
              anchor.focus({ preventScroll: true });
            }
          });
          update();
        }

        // ---- Pixel motion: единый ступенчатый язык для всех экранов ----
        var motionInitialized = false;
        function restartMotion(el, className, lifetime) {
          if (!el || motionReduced()) return;
          el.classList.remove(className);
          void el.offsetWidth;
          el.classList.add(className);
          window.setTimeout(function () { el.classList.remove(className); }, lifetime || 620);
        }

        function initPixelMotion() {
          if (motionReduced() || motionInitialized) return;
          motionInitialized = true;
          var root = document.documentElement;
          var selector = [
            'body.focus-page .resume-banner',
            'body.focus-page .focus-training > *',
            'body.result-page .ed-page > *',
            'body.settings-page .handoff-page-head',
            'body.settings-page .settings-tablist',
            'body.settings-page .settings-panel.is-active .builder-main > *',
            'body.settings-page .settings-panel.is-active .builder-aside > *',
            'body.stats-page .stats-intro',
            'body.stats-page .dashboard-grid > *',
            'body.stats-page .section-tabs',
            'body.stats-page .stats-panel.is-active > *',
            'body.summary-page .summary-hero',
            'body.summary-page .summary-actions',
            'body.summary-page .summary-detail-grid > *',
            'body.error-page .error-card > *'
          ].join(',');
          var targets = Array.prototype.slice.call(document.querySelectorAll(selector), 0, 28);
          targets.forEach(function (el, index) {
            el.classList.add('pixel-reveal');
            el.style.setProperty('--pixel-order', String(index % 7));
          });
          root.classList.add('pixel-motion-ready');
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              targets.forEach(function (el) { el.classList.add('is-revealed'); });
            });
          });
        }

        document.addEventListener('pointerdown', function (event) {
          var control = event.target.closest('button, a, summary');
          if (control) restartMotion(control, 'is-pixel-pressed', 220);
        });

        document.addEventListener('change', function (event) {
          var control = event.target.closest('label, .segment-chip, .switch-row');
          if (control) restartMotion(control, 'is-pixel-updated', 340);
        });

        document.addEventListener('click', function (event) {
          var tab = event.target.closest('[role="tab"][aria-controls]');
          if (!tab) return;
          window.setTimeout(function () {
            restartMotion(document.getElementById(tab.getAttribute('aria-controls')), 'pixel-panel-enter', 460);
          }, 0);
        });

        document.addEventListener('themechange', function () {
          restartMotion(document.body, 'pixel-theme-swap', 560);
        });

        document.addEventListener('motionchange', function () {
          if (motionReduced()) {
            document.documentElement.classList.remove('pixel-motion-ready');
          } else {
            motionInitialized = false;
            initPixelMotion();
          }
        });

        initPixelMotion();
      })();
    </script>
</th:block>
</body>
</html>
