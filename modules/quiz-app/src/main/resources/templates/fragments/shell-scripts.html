<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Декоративный пиксель-слой. Единственный JS вне графа импортов app-entry.js:
     он самодостаточен, ничего из ядра не импортирует и на общий поток не влияет.
     Тоггл темы и кнопка «наверх» переехали в модуль ui/shell.js — они делили с
     ядром motionReduced() и уже успели разойтись с ним копией. */-->
<th:block th:fragment="shell-scripts">
    <!--/* Пути к спрайтам зашиты в pixel-fx.js строками — через @{...} они не проходят,
         и content-hash их не касается. Карта «канонический путь → версионированный»
         (StaticVersionAdvice) даёт версию и им; сам скрипт прогоняет через неё пути
         перед присваиванием в img.src. Тип application/json — данные, не код: CSP не
         исполняет и nonce не нужен. Без версионирования атрибут null и тега нет. */-->
    <script type="application/json" id="pixel-asset-map"
            th:if="${pixelAssetMap}" th:utext="${pixelAssetMap}"></script>
    <script th:src="@{/js/pixel-fx.js}" defer th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
