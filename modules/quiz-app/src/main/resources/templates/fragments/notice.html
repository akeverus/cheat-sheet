<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Слот сообщения — пустой контейнер, в который говорит ui/alerts.js.

     `data-notice-host` — контракт поиска, а не украшение: слотов на странице
     может быть два (страничный там, где у сообщения есть законное место рядом с
     действием, и общий из shell-head.html), и скрипт выбирает страничный, если
     он есть. До iter-82 контракта не было вовсе — скрипт искал `#interview-alert`,
     который печатали только focus и result, и четыре сообщения об ошибке из
     quiz/bookmarks.js («Не удалось сохранить заметку…») не доезжали НИКУДА:
     setInlineAlert молча возвращался на отсутствующем хосте.

     role/aria-live здесь выставлены под ошибку (assertive); успех переключает их
     на status/polite в скрипте — тон сообщения известен только в момент вызова. */-->
<div th:fragment="notice-slot(id, scope)">
    <div th:attr="id=${id},data-notice-host=${scope}"
         data-ui-fragment="notice-slot"
         class="notice hidden"
         role="alert"
         aria-live="assertive"
         hidden></div>
</div>
</body>
</html>
