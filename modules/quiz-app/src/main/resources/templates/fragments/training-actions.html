<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="training-actions(submitId, submitText, submitDisabled, submitTitle, hintText)"
     data-ui-fragment="training-actions">
    <div class="action-footer" id="action-footer">
        <!-- Без aria-live: иначе скринридер озвучивал бы счётчик каждую секунду.
             Визуальный таймер достаточен; пороговые анонсы тут избыточны. -->
        <span id="question-timer" class="question-timer hidden" aria-hidden="true"></span>
        <button type="submit"
                th:attr="id=${submitId},title=${submitTitle}"
                th:disabled="${submitDisabled}"
                aria-keyshortcuts="Enter"
                th:text="${submitText}">Ответить</button>
        <a id="next-question" class="btn next-btn hidden" th:href="@{/}" aria-keyshortcuts="Enter">Следующий вопрос</a>
    </div>
    <!-- Без aria-live: подсказка статична, сервер рендерит её один раз и app.js
         к ней не обращается — live-region тут только шумел бы (критика D13).
         Символ ⌨ убран: рендерился цветным эмодзи на части ОС, вне системы
         монохромных Lucide-иконок (критика C34) — текст самодостаточен. -->
    <p class="keyboard-hint" th:text="${hintText}">1–9 — выбор, ↑/↓ — навигация, Enter — отправка</p>
</div>
</body>
</html>
