<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="training-actions(submitId, submitText, submitDisabled, submitTitle, hintText)"
     data-ui-fragment="training-actions">
    <div class="action-footer" id="action-footer">
        <!-- Без aria-live: иначе скринридер озвучивал бы счётчик каждую секунду.
             Визуальный таймер достаточен; пороговые анонсы тут избыточны. -->
        <span id="question-timer" class="question-timer hidden" aria-hidden="true"></span>
        <button type="submit"
                th:attr="id=${submitId},title=${submitTitle}"
                th:disabled="${submitDisabled}"
                aria-keyshortcuts="Enter"
                th:text="${submitText}">Ответить</button>
        <a id="next-question" class="btn next-btn hidden" href="/" aria-keyshortcuts="Enter Space">Следующий вопрос</a>
    </div>
    <p class="keyboard-hint" aria-live="polite" th:text="${hintText}">⌨ 1-9 — выбор, ↑/↓ — навигация, Enter — отправка</p>
</div>
</body>
</html>
