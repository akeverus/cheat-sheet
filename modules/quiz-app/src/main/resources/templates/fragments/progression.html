<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  МЕСТО В ПУТИ — один компонент на два экрана.

  Прогрессия в продукте была честной задолго до этого фрагмента: XP суммируется из
  реальных попыток (ExperienceService.award), уровень выводится формулой из XP
  (UserExperience.levelForXp). Невидимой была не механика, а МЕСТО: замер на живых
  итогах показал единственную точку показа — подпись 11px серым под числом опыта,
  «Уровень 7 · до следующего 902 XP». Ни аналитика, ни экран тренировки уровня не
  показывали, а до итогов доезжают не все режимы: TRAINING работает без сессии
  вовсе, то есть у ежедневного сценария прогрессии не было.

  Два числа вместо одного. «До следующего 902 XP» не отвечает ни на один вопрос:
  902 из скольких? У уровня 7 цена 1300 XP, то есть пройдено 398 — почти треть, а
  выглядело как «ещё 902 неизвестно чего». Полоса показывает долю, подпись рядом
  повторяет её числами: доля не должна быть единственным носителем смысла.

  <progress>, а не div с инлайновым style. Причин две, и обе жёсткие: (1) продукт
  обязан работать без JS, а существующая полоса сессии заполняется скриптом через
  --progress, то есть без JS осталась бы пустой; (2) CSP запрещает style-атрибуты
  (style-src-attr 'none'), так что серверный inline-style тоже не вариант. Нативный
  элемент решает обе задачи и приносит роль progressbar со значениями бесплатно.

  Обращение к бину (@plural) обязано целиком стоять ВНУТРИ ${...}. Вне блока
  Thymeleaf не разбирает выражение и падает на этапе парсинга — то есть ПОСЛЕ
  отправки заголовков: код 200, тело обрывается посреди chunked-потока, браузер
  показывает ERR_INCOMPLETE_CHUNKED_ENCODING, а curl молча отдаёт кусок. Ровно так
  этот фрагмент и сломался в первой сборке.

  КОРОБКУ ДАЁТ ХОЗЯИН (доктрина FRD-053, та же, что у .notice и пустых состояний).
  Первая сборка ставила `card` прямо на секцию — и на итогах, где блок стоит ВНУТРИ
  карточки результата, получилась карточка в карточке: две кромки одна в другой на
  расстоянии поля. В аналитике блок самостоятельный, там карточку даёт страница.

  sessionXp != null — строка «эта сессия дала +N XP»; на аналитике сессии нет.
*/-->
<section th:fragment="rank(p, sessionXp)" class="rank" th:if="${p != null}"
         aria-labelledby="rank-title">
    <!--/* Герб СТУПЕНИ, а не знак раздела «Тренировка». Раньше здесь стоял `#training`:
         одна и та же картинка у всех семи ступеней, то есть самый крупный элемент
         карточки (48px) о прогрессии молчал, да ещё и повторял знак пункта меню.
         Обращение к бину целиком внутри ${...} — иначе Thymeleaf падает на разборе
         уже после отправки заголовков (см. заметку про @plural выше). */-->
    <svg class="rank-emblem" aria-hidden="true"><use th:attr="href='#' + ${@rankUtils.glyph(p.rank())}" href="#px-rank-apprentice"></use></svg>
    <div class="rank-body">
        <h2 class="rank-title" id="rank-title">
            <span class="rank-name" th:text="${p.rank().title()}">Ученик</span>
            <span class="rank-level" th:text="'уровень ' + ${p.level()}">уровень 1</span>
        </h2>
        <!--/* value/max — реальные XP, а не проценты: скринридер читает «398 из 1300»,
             то есть то же, что видит глаз в подписи ниже. Заголовок связан с секцией
             через aria-labelledby, поэтому отдельная aria-label полосе не нужна —
             ей достаточно собственной подписи. */-->
        <progress class="rank-bar" th:value="${p.xpIntoLevel()}" th:max="${p.xpToNextLevel()}"
                  th:text="${p.xpIntoLevel()} + ' из ' + ${p.xpToNextLevel()} + ' XP'">0 из 100 XP</progress>
        <p class="rank-scale">
            <span th:text="${p.xpIntoLevel()} + ' из ' + ${p.xpToNextLevel()} + ' XP'">0 из 100 XP</span>
            <span class="rank-scale-sep" aria-hidden="true">·</span>
            <span th:text="'до уровня ' + ${p.level() + 1} + ' — ' + ${p.xpLeftToNextLevel()} + ' XP'">до уровня 2</span>
        </p>
        <!--/* Расстояние до ступени — в УРОВНЯХ, а не в XP: XP до следующей ступени у
             старших рангов измеряется тысячами и ничего не проясняет, а «ещё три
             уровня» соотносится с полосой, которая тут же рядом. У последней ступени
             продолжения нет, и врать об этом нельзя — строка просто не выводится. */-->
        <p class="rank-next muted" th:if="${p.nextRankTitle() != null}"
           th:text="${'До ступени «' + p.nextRankTitle() + '» ещё ' + p.levelsToNextRank()
                    + ' ' + @plural.pick(p.levelsToNextRank(), 'уровень', 'уровня', 'уровней')}">До следующей ступени</p>
        <p class="rank-next muted" th:if="${p.nextRankTitle() == null}">Последняя ступень гильдии — дальше только удержание.</p>
        <p class="rank-session" th:if="${sessionXp != null and sessionXp > 0}"
           th:text="'Эта сессия дала +' + ${sessionXp} + ' XP'">Эта сессия дала +0 XP</p>

        <!--/* ВИТРИНА ПУТИ. Карточка отвечала на «где я сейчас» и «сколько до следующей»,
             но сам путь был невидим: названия старших ступеней («Хранитель», «Магистр»)
             человек впервые узнавал, только дойдя до них, а `GuildRank.all()` — метод,
             написанный в домене со словами «для витрины пути», — не вызывал никто, кроме
             тестов.

             `<details>`, а не постоянный блок: путь смотрят изредка, и семь строк над
             полосой опыта были бы преамбулой к тому, ради чего карточку открывают.
             Нативное раскрытие работает без JS и приносит клавиатуру и роль бесплатно.

             Текущая ступень помечена СЛОВОМ («сейчас») и `aria-current`, а не только
             начертанием: состояние не держится на цвете. */-->
        <details class="rank-ladder">
            <summary class="rank-ladder-summary">
                <span>Весь путь гильдии</span>
                <span class="rank-ladder-count muted"
                      th:text="${#lists.size(@rankUtils.ladder(p.rank()))} + ' ступеней'">7 ступеней</span>
            </summary>
            <ol class="rank-ladder-list">
                <li th:each="step : ${@rankUtils.ladder(p.rank())}" class="rank-step"
                    th:classappend="${step.current()} ? 'is-current' : ''"
                    th:attr="aria-current=${step.current()} ? 'step' : null">
                    <svg class="rank-step-emblem" aria-hidden="true" focusable="false">
                        <use th:attr="href='#' + ${step.glyph()}" href="#px-rank-apprentice"></use>
                    </svg>
                    <span class="rank-step-title" th:text="${step.title()}">Ученик</span>
                    <span class="rank-step-levels muted" th:text="${step.levels()}">уровни 1–2</span>
                    <span class="rank-step-now" th:if="${step.current()}">сейчас</span>
                </li>
            </ol>
        </details>
    </div>
</section>
</body>
</html>
