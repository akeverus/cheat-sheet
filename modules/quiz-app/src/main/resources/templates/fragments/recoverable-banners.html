<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- FLOW-04: recoverable banners — offline / network / session expired.
     Offline/network обновляет app.js; expired — flash с сервера. -->
<div th:fragment="recoverable-banners">
    <div id="network-offline-banner" class="recoverable-banner recoverable-banner-offline hidden"
         role="status" aria-live="polite" hidden>
        <strong>Нет сети.</strong>
        <span>Ответ можно отправить, когда соединение вернётся — черновик выбора сохранится на странице.</span>
    </div>
    <div id="session-expired-banner" class="recoverable-banner recoverable-banner-expired"
         role="alert"
         th:if="${sessionExpired == true}"
         th:classappend="${sessionExpired == true} ? '' : ' hidden'">
        <strong>Сессия истекла.</strong>
        <span>Прогресс мог сохраниться на паузе.
            <a th:href="@{/}">Вернуться к тренировке</a>
            или
            <a th:href="@{/settings}">начать новую сессию</a>.
        </span>
    </div>
</div>
</body>
</html>
