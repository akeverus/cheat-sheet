<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Topbar (редизайн): верхняя полоса колонки контента на десктопе (прогресс
     сессии слева + тоггл темы справа) и mobile-header на мобильном (бренд +
     тоггл темы). Прогресс показывается только когда идёт сессия/повторение;
     на аналитике/настройках слева пусто.

     Навигации здесь НЕТ намеренно: разделы живут в сайдбаре (десктоп) и в
     mobile-nav (мобильный). Не добавлять сюда ссылки на разделы — это ровно
     тот дубль, который отсюда убран. */-->
<th:block th:fragment="topbar">
    <!--/* Pixel-art спрайт продуктовых состояний (GFX-008). Topbar есть на всех
         7 страницах — один include делает px-* глифы (offline/empty-chart/
         diagram-error) доступными глобально для <use>. Спрайт = display:none-
         определения (.icon-sprite), позиция в DOM не важна. */-->
    <svg th:replace="~{fragments/state-illustrations :: sprite}"></svg>
    <noscript>
        <div class="inline-alert ed-noscript" role="alert">
            <strong>JavaScript отключён.</strong> Без него часть интерактивных элементов
            (раскрытие подсказок, hotkey-навигация, графики на Аналитике) работать не будут.
            Базовый flow (вопрос → ответ → результат) останется доступен через формы.
        </div>
    </noscript>
    <div th:replace="~{fragments/recoverable-banners :: recoverable-banners}"></div>
    <header class="topbar">
        <!--/* Слева здесь стоял прогресс сессии: эйбрау «Прогресс в сессии»,
             мини-трек и счётчик «N / M». Ровно те же факты в тот же момент
             печатает рельс сессии в колонке контента («Прогресс сессии», трек,
             «N/M») — двести пикселей ниже. Два `role="progressbar"` об одном и
             том же на одном экране, причём в РАЗНЫХ единицах (0–100 процентов
             против 0–N вопросов), и топбарный — вовсе без `aria-label`:
             скринридер объявлял безымянный индикатор на 20%, а следом
             именованный «1 из 5».

             Уникальной работы у крамба не было и за пределами экрана фокуса:
             `interviewSession` в модель других страниц не кладётся, так что на
             /stats и /settings он оставался пустым `<div>` даже посреди сессии —
             то есть напоминанием «сессия идёт» не работал. Это остаток эпохи до
             рельса; выше в этом же файле уже описано, как отсюда убрали дубль
             навигации — прогресс был вторым дублем и пережил ту чистку.

             Не возвращать: место сессионного статуса — рельс, рядом с паузой,
             завершением и «сегодня». */-->
        <!--/* Здесь стояли пять icon-only ссылок (/, /stats, /review, /bookmarks,
             /settings) и вторая кнопка «Выйти». Все шесть вели ровно туда же,
             куда пункты сайдбара в 200px левее — только без подписей и без
             aria-current. Две параллельные навигации по одним и тем же
             адресам: пользователю приходится решать, какая «главная», SR
             озвучивает каждый раздел дважды, а клавиатура тратит 6 табов до
             контента. Навигация теперь одна — сайдбар (подписанная,
             с активным пунктом).

             Остаётся тоггл темы: это не пункт назначения, а переключатель
             отображения, и в списке разделов ему не место. В topbar справа он
             встаёт ровно туда же, где уже стоит в mobile-header ниже, — один
             контрол в одном месте на всех ширинах. */-->
        <div class="top-actions">
            <!--/* PE: hidden снимает ui/shell.js при работающем JS — без него
                 мёртвой кнопки не появляется. Он же держит aria-label/title
                 в согласии с текущей темой. Без aria-pressed намеренно:
                 светлая и тёмная — равноправные режимы, а не вкл/выкл
                 (обоснование в ui/shell.js). */-->
            <button type="button" class="icon-button hidden" data-theme-toggle
                    aria-label="Переключить тему" title="Переключить тему">
                <svg class="icon" aria-hidden="true"><use href="#theme"></use></svg>
            </button>
        </div>
    </header>
    <header class="mobile-header">
        <a class="brand" th:href="@{/}">
            <span class="avatar" aria-hidden="true">
                <img th:src="@{/img/pixel/mascot.png}" width="24" height="24" alt="" decoding="async">
            </span>
            <span class="brand-label">Cheat&nbsp;Sheet</span>
        </a>
        <div class="top-actions">
            <button type="button" class="icon-button hidden" data-theme-toggle
                    aria-label="Переключить тему" title="Переключить тему">
                <svg class="icon" aria-hidden="true"><use href="#theme"></use></svg>
            </button>
            <form th:if="${multiSecurityMode}" class="topbar-logout" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="icon-button" aria-label="Выйти"
                        th:title="${currentUsername != null ? ('Выйти (' + currentUsername + ')') : 'Выйти'}">
                    <svg class="icon" aria-hidden="true"><use href="#logout"></use></svg>
                </button>
            </form>
        </div>
    </header>
</th:block>
</body>
</html>
