<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Topbar (редизайн): верхняя полоса колонки контента на десктопе (прогресс
     сессии слева + icon-действия справа) и mobile-header на мобильном (бренд +
     тоггл темы). Прогресс показывается только когда идёт сессия/повторение;
     на аналитике/настройках слева пусто. -->
<th:block th:fragment="topbar">
    <noscript>
        <div class="inline-alert ed-noscript" role="alert">
            <strong>JavaScript отключён.</strong> Без него часть интерактивных элементов
            (раскрытие подсказок, hotkey-навигация, графики на Аналитике) работать не будут.
            Базовый flow (вопрос → ответ → результат) останется доступен через формы.
        </div>
    </noscript>
    <div th:replace="~{fragments/recoverable-banners :: recoverable-banners}"></div>
    <header class="topbar">
        <div class="crumb" th:if="${(interviewSession != null or (reviewMode != null and reviewMode)) and progressPercent != null}">
            <span class="eyebrow">Прогресс в сессии</span>
            <div class="progress-mini" role="progressbar"
                 th:attr="aria-valuenow=${#numbers.formatDecimal(progressPercent, 1, 0)},aria-valuemin=0,aria-valuemax=100">
                <span th:attr="data-progress=${#numbers.formatDecimal(progressPercent, 1, 1)}"></span>
            </div>
            <b class="mono tiny" th:if="${interviewSession != null}">
                <span th:text="${interviewSession.getIndex() + 1}">1</span>&nbsp;/&nbsp;<span th:text="${interviewSession.getTotal()}">10</span>
            </b>
        </div>
        <div class="crumb" th:unless="${(interviewSession != null or (reviewMode != null and reviewMode)) and progressPercent != null}"></div>
        <div class="top-actions">
            <a class="icon-button" th:href="@{/}" aria-label="Фокус" title="Фокус">
                <svg class="icon" aria-hidden="true"><use href="#home"></use></svg>
            </a>
            <a class="icon-button" th:href="@{/stats}" aria-label="Аналитика" title="Аналитика">
                <svg class="icon" aria-hidden="true"><use href="#analytics"></use></svg>
            </a>
            <a class="icon-button" th:href="@{/review}" aria-label="Разбор ошибок" title="Разбор ошибок">
                <svg class="icon" aria-hidden="true"><use href="#repeat"></use></svg>
            </a>
            <a class="icon-button" th:href="@{/bookmarks}" aria-label="Закладки" title="Закладки">
                <svg class="icon" aria-hidden="true"><use href="#bookmark"></use></svg>
            </a>
            <a class="icon-button" th:href="@{/settings}" aria-label="Настройки" title="Настройки">
                <svg class="icon" aria-hidden="true"><use href="#settings"></use></svg>
            </a>
            <form th:if="${multiSecurityMode}" class="topbar-logout" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="icon-button" aria-label="Выйти"
                        th:title="${currentUsername != null ? ('Выйти (' + currentUsername + ')') : 'Выйти'}">
                    <svg class="icon" aria-hidden="true"><use href="#logout"></use></svg>
                </button>
            </form>
        </div>
    </header>
    <header class="mobile-header">
        <a class="brand" th:href="@{/}">
            <span class="avatar" aria-hidden="true">
                <img th:src="@{/img/pixel/mascot.png}" width="22" height="22" alt="" decoding="async">
            </span>
            <span class="brand-label">Cheat&nbsp;Sheet</span>
        </a>
        <div class="top-actions">
            <button type="button" class="icon-button hidden" data-theme-toggle
                    aria-pressed="false" aria-label="Переключить тему" title="Светлая / тёмная тема">
                <svg class="icon" aria-hidden="true"><use href="#theme"></use></svg>
            </button>
            <form th:if="${multiSecurityMode}" class="topbar-logout" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="icon-button" aria-label="Выйти"
                        th:title="${currentUsername != null ? ('Выйти (' + currentUsername + ')') : 'Выйти'}">
                    <svg class="icon" aria-hidden="true"><use href="#logout"></use></svg>
                </button>
            </form>
        </div>
    </header>
</th:block>
</body>
</html>
