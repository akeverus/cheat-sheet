<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Topbar (редизайн): контекст страницы слева + icon-действия справа на desktop;
     mobile-header на мобильном (бренд + тоггл темы). Прогресс сессии живёт внутри
     question workspace, как в handoff-макете. -->
<th:block th:fragment="topbar">
    <noscript>
        <div class="inline-alert ed-noscript" role="alert">
            <strong>JavaScript отключён.</strong> Без него часть интерактивных элементов
            (раскрытие подсказок, hotkey-навигация, графики на Аналитике) работать не будут.
            Базовый flow (вопрос → ответ → результат) останется доступен через формы.
        </div>
    </noscript>
    <header class="topbar">
        <div class="crumb">
            <span class="crumb-label" th:text="${topbarLabel != null ? topbarLabel : 'Технический тренажёр'}">Технический тренажёр</span>
        </div>
        <div class="top-actions">
            <a class="icon-button" th:href="@{/stats(important=true)}" aria-label="Закладки" title="Закладки">
                <svg class="icon" aria-hidden="true"><use href="#bookmark"></use></svg>
            </a>
            <a class="icon-button" th:href="@{/settings}" aria-label="Настройки" title="Настройки">
                <svg class="icon" aria-hidden="true"><use href="#settings"></use></svg>
            </a>
        </div>
    </header>
    <header class="mobile-header">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">
                <svg class="icon"><use href="#code"></use></svg>
            </span>
            <span>Cheat&nbsp;Sheet</span>
        </a>
        <div class="top-actions">
            <button type="button" class="icon-button hidden" data-theme-toggle
                    aria-pressed="false" aria-label="Переключить тему" title="Светлая / тёмная тема">
                <svg class="icon" aria-hidden="true"><use href="#theme"></use></svg>
            </button>
        </div>
    </header>
</th:block>
</body>
</html>
