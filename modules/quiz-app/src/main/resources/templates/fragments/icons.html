  presentation-атрибутов (fill/stroke), их задаёт .ed-icon в editorial.css
  через currentColor — так иконки наследуют цвет текста/акцента и одинаково
  выглядят в обеих темах. Заменяет разноцветные эмодзи, которые рендерились
  по-разному на разных ОС и выбивались из editorial-палитры.

  Подключается ОДИН раз на страницу через header-фрагмент (он есть везде).
  Использование: <svg class="ed-icon"><use href="#i-<name>"></use></svg>
  В JS — та же строка (вставляется через innerHTML, не через sanitizeHtml).

  display:none + aria-hidden — спрайт это определения, не контент.
