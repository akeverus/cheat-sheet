<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  SVG-спрайт иконок (Lucide, ISC). Единый источник правды: символы без
  presentation-атрибутов (fill/stroke), их задаёт .ed-icon в base.css
  через currentColor — так иконки наследуют цвет текста/акцента и одинаково
  выглядят в обеих темах. Заменяет разноцветные эмодзи, которые рендерились
  по-разному на разных ОС и выбивались из editorial-палитры.

  Подключается ОДИН раз на страницу через header-фрагмент (он есть везде).
  Использование: <svg class="ed-icon"><use href="#i-<name>"></use></svg>
  В JS — та же строка (вставляется через innerHTML, не через sanitizeHtml).

  .icon-sprite + aria-hidden — спрайт это определения, не контент. ВАЖНО:
  HTML-атрибут hidden на <svg>-корне в Chrome НЕ даёт display:none (это
  HTML-поведение, SVG-namespace его не наследует) — спрайт рендерился
  replaced-боксом 300×150 и создавал ~159px МЁРТВОГО отступа сверху на КАЖДОЙ
  странице/дизайне. Зануляем габариты классом .icon-sprite (position:absolute;
  width/height:0; overflow:hidden) — канонический безопасный hide SVG-спрайта:
  работает во всех браузерах и НЕ ломает <use>-ссылки (в отличие от display:none,
  который рвёт <use> в части браузеров, напр. Safari). Контракт «ноль inline
  style=» соблюдён (класс, не style=; InterviewControllerTest
  .assertNoInlineUiAttributes). <use href="#i-…"> ссылается на <symbol> штатно.
-->
<svg th:fragment="sprite" class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
    <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 22V2.8a.8.8 0 0 1 1.17-.71l11.38 5.69a.8.8 0 0 1 0 1.44L6 15.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-circle-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
    <!-- i-arrow-up удалён в редизайне: back-to-top теперь на пиксельном спрайте (#arrow). -->
    <!-- download (Lucide): лоток + стрелка вниз = экспорт/скачивание файла. Заменяет сырой юникод «↓» на кнопках экспорта (система иконок, не unicode-глиф). -->
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14" rx="1"/></symbol>
    <!-- i-shapes (переключатель дизайна) удалён в FE-CMP-1: единственный дизайн Instrument. -->
    <!-- i-layout удалён в редизайне: переключатель раскладки убран (legacy-ось). -->
    <!-- code (Lucide): угловые скобки = «код». Аффорданс блока кода к вопросу (#7). -->
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
    <symbol id="i-diagram" viewBox="0 0 24 24"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></symbol>
</svg>
</body>
</html>
