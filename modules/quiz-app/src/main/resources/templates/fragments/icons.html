  `shape-rendering="crispEdges"`. Тот же язык, что у спрайта состояний
  (fragments/state-illustrations.html); разница только в роли и размере:
  здесь — иконка при тексте (16px), там — hero-глиф состояния (64px).

  ЧТО БЫЛО ДО. Продукт держал ТРИ словаря сразу:
    1) этот файл — линейные Lucide-символы (viewBox 24, stroke-width 2);
    2) fragments/pixel-sprite.html — «пиксельный» спрайт, который пиксельным не
       был: 15 из 25 его символов содержали дуги и диагонали (`clock` — круг,

    3) fragments/state-illustrations.html — настоящий пиксель 16×16.
  Замер по всем шаблонам, JS и NavSection: из 25 символов второго спрайта живыми
  были ВОСЕМЬ, 17 не использовались нигде (68% файла). При этом шесть понятий
  имели по два глифа сразу — code, diagram, star, check, copy, close/x, — и во
  всех шести парах жил линейный, а пиксельный был мёртв. Каждая страница грузила
  оба спрайта.

  РЕШЕНИЕ. Один файл, один язык, только живые смыслы: 23 символа — восемь
  оболочки и навигации (щит тренировки, книги каталога, столбцы аналитики,
  закладка, ползунки настроек, полумесяц темы, дверь выхода, стрелка наверх) и
  пятнадцать интерфейсных, которые раньше приезжали линейными.

  РАЗМЕР ТОЛЬКО ЦЕЛОЧИСЛЕННЫЙ. У сетки 16×16 дробный масштаб даёт мыло: 1em при
  кегле 18px — это 1.125 пикселя на клетку. Поэтому база 16px, и контекстные
  оверрайды 14/15px (их было пять) сняты, а не переписаны.

  Использование: <svg class="px-icon" aria-hidden="true"><use href="#name"></use></svg>
  Иконка ДЕКОРАТИВНА: рядом всегда есть подпись или aria-label — смысл несёт
  текст (WCAG 1.1.1). Габариты зануляет .icon-sprite: спрайт = определения.
*/-->
