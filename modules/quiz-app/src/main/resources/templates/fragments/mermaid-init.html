<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script th:fragment="mermaid-init">
    // Инициализация и рендер mermaid-диаграмм (статичные .mermaid-блоки на странице,
    // пришедшие из MarkdownRenderService как <div class="mermaid">). Динамически
    // вставленные через AJAX диаграммы дорисовывает app.js (renderDynamicContent).
    // Guard: если mermaid не загрузился (offline, CSP, ad-blocker), убираем
    // блоки .mermaid вместо падения с ReferenceError.
    (function() {
        // Этап 3 редизайна (DiagramBlock, docs 3.5/8.3): при невозможности
        // отрисовать диаграмму НЕ удаляем контент, если есть вкладка «Исходник»
        // (.diagram-source-details) — вместо этого прячем неотрисованный .mermaid
        // (data-render-failed) и принудительно раскрываем исходник. Так вопрос со
        // схемой остаётся осмысленным даже когда mermaid недоступен/упал. Для
        // легаси-диаграмм без исходника (напр. внутри .markdown-content разбора)
        // поведение прежнее — удаляем блок, чтобы не показывать сырой граф.
        function failDiagram(el) {
            var qd = el.closest('.question-diagram');
            var details = qd ? qd.querySelector('.diagram-source-details') : null;
            if (qd && details) {
                qd.setAttribute('data-render-failed', 'true');
                el.textContent = '';
                details.open = true;
            } else if (qd) {
                qd.remove();
            } else {
                el.remove();
            }
        }
        function dropAllDiagrams() {
            document.querySelectorAll('.mermaid').forEach(failDiagram);
        }
        if (typeof mermaid === 'undefined') {
            document.addEventListener('DOMContentLoaded', dropAllDiagrams);
            return;
        }
        // securityLevel:'antiscript' (НЕ 'loose') — round-01 C21: источник диаграмм
        // включает AI-вывод (недоверенные данные). 'antiscript' рендерит HTML в
        // label-ах (диаграммы используют <b>/<br/>), но вырезает <script> и
        // обработчики событий → XSS-поверхность 'loose' закрыта, формат сохранён.
        //
        // Тема mermaid = 'base' + themeVariables из ЖИВЫХ CSS-токенов текущей темы
        // (реставр handoff-3): диаграммы вписаны в «терминальную» палитру —
        // surface-soft узлы с border-strong, teal-акцент, тёмный фон — вместо
        // белых боксов 'neutral', выбивавшихся из тёмного дефолта. data-theme уже
        // разрешён pre-paint-скриптом (head.html) до DOMContentLoaded, поэтому по
        // умолчанию (dark) берутся тёмные токены. Смена темы после рендера цвета не
        // перекрашивает (SVG запечён) — как и раньше; дефолт-dark это покрывает.
        var mmStyle = getComputedStyle(document.documentElement);
        function mmTok(name, fb) { return (mmStyle.getPropertyValue(name) || '').trim() || fb; }
        var mmBg      = mmTok('--color-bg-secondary', '#0d1b22');
        var mmSurface = mmTok('--color-surface-soft', '#102029');
        var mmRaised  = mmTok('--color-bg-tertiary', '#12252e');
        var mmBorder  = mmTok('--color-border-strong', '#335463');
        var mmText    = mmTok('--color-text-primary', '#eef6f5');
        var mmText2   = mmTok('--color-text-secondary', '#a8b9bd');
        var mmLine    = mmTok('--color-text-tertiary', '#8397a0');
        var mmAccent  = mmTok('--color-accent-primary', '#39d0c7');
        var mmFont    = mmTok('--font-family-body', 'Inter, system-ui, sans-serif');
        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'antiscript',
            theme: 'base',
            themeVariables: {
                darkMode: document.documentElement.getAttribute('data-theme') !== 'light',
                background: mmBg,
                fontFamily: mmFont,
                primaryColor: mmSurface,
                primaryTextColor: mmText,
                primaryBorderColor: mmBorder,
                secondaryColor: mmRaised,
                secondaryTextColor: mmText,
                secondaryBorderColor: mmBorder,
                tertiaryColor: mmRaised,
                tertiaryTextColor: mmText,
                tertiaryBorderColor: mmBorder,
                mainBkg: mmSurface,
                nodeBorder: mmBorder,
                nodeTextColor: mmText,
                lineColor: mmLine,
                edgeLabelBackground: mmBg,
                clusterBkg: mmBg,
                clusterBorder: mmBorder,
                titleColor: mmText,
                labelColor: mmText,
                labelTextColor: mmText,
                textColor: mmText2,
                accent: mmAccent
            }
        });
        document.addEventListener('DOMContentLoaded', async function() {
            var els = document.querySelectorAll('.mermaid');
            for (var i = 0; i < els.length; i++) {
                if (els[i].getAttribute('data-rendered') === 'true') continue;
                try {
                    var id = 'mmd-' + Math.random().toString(36).slice(2);
                    var res = await mermaid.render(id, els[i].textContent);
                    els[i].innerHTML = res.svg;
                    els[i].setAttribute('data-rendered', 'true');
                    var svg = els[i].querySelector('svg');
                    if (svg) {
                        svg.removeAttribute('height');
                        svg.style.width = '100%';
                        svg.style.height = 'auto';
                        svg.style.maxHeight = '100%';
                    }
                } catch (e) {
                    failDiagram(els[i]);
                    document.querySelectorAll('[id^="dmmd-"]').forEach(function(n){n.remove()});
                    document.querySelectorAll('.error-icon').forEach(function(n){
                        var p = n.closest('div'); if(p) p.remove();
                    });
                }
            }
        });
    })();
</script>
</head>
</html>
