<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Bottom-nav (редизайн): нижняя навигация на мобильном (desktop скрыт — см.
     shell.css). Состав пунктов и их порядок — не здесь: первый уровень объявлен
     один раз в NavSection и читается обеими навигациями. safe-area учтён в CSS. */-->
<nav th:fragment="mobile-nav(active)" class="mobile-nav" aria-label="Мобильная навигация">
    <!--/* Пункты — тот же NavSection, что и в рельсе. До этого список был написан
         здесь руками и разошёлся с рельсом: пять пунктов против шести, без
         каталога банка, то есть «Темы» на телефоне были недостижимы вовсе, хотя
         topics.html передавал сюда active='topics'. Число колонок полосы теперь
         тоже следует за числом пунктов (shell.css), а не за литералом. */-->
    <a th:each="section : ${@nav.sections()}"
       th:href="@{${section.path()}}"
       th:classappend="${active == section.id()} ? 'active'"
       th:title="${section.hint() != null} ? ${section.hint()} : ${section.label()}"
       th:aria-label="${section.label()}"
       th:attr="aria-current=${active == section.id()} ? 'page' : null">
        <svg class="px-icon" aria-hidden="true"><use th:attr="href='#' + ${section.icon()}"></use></svg><span th:text="${section.label()}">Раздел</span>
    </a>
</nav>
</body>
</html>
