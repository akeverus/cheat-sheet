<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Рельс приложения (sidebar): постоянная левая колонка на десктопе, на
     мобильном скрыта — см. shell.css, там работает mobile-nav.
     active ∈ {focus, analytics, review, settings, bookmarks}.

     Ширина рельса — не литерал, а --sidebar-width (tokens.css): clamp от
     собственного содержимого. Числа в комментариях не держим намеренно: с
     220px в токене здесь и в шапке shell.css годами стояло «232px».

     Три зоны сверху вниз: бренд → навигация → футер глобальных действий.
     Промежуточной распорки (`.sidebar-spacer`) нет: футер отжимает вниз
     margin-top:auto, а пустой div, чья единственная роль — flex:1, был лишним
     узлом в дереве доступности между nav и действиями.

     В списке только те разделы, куда можно перейти. Заглушки «Вопросы скоро» и
     «Достижения скоро» убраны: они занимали два из восьми слотов главной
     навигации (четверть), кликнуть их было нельзя, а «Вопросы» ещё и путались
     с существующими «Темами». Анонс дорожной карты — не навигация; когда
     разделы появятся, они встанут сюда обычными ссылками.

     Метка обязательна: на экране фокуса это не единственный complementary —
     рядом живёт focus-session-rail, и без label скринридер объявляет два
     безымянных «дополнения» подряд, различить которые в списке ориентиров
     нельзя. Внутренний nav подписан отдельно: он часть панели, а не вся она. */-->
<aside th:fragment="sidebar(active)" class="sidebar" aria-label="Боковая панель">
    <a class="brand" th:href="@{/}">
        <span class="avatar" aria-hidden="true">
            <img th:src="@{/img/pixel/mascot.png}" width="24" height="24" alt="" decoding="async">
        </span>
        <span>Cheat&nbsp;Sheet</span>
    </a>
    <nav class="nav" aria-label="Основная навигация">
        <a th:href="@{/}" th:classappend="${active == 'focus'} ? 'active'"
           th:attr="aria-current=${active == 'focus'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#training"></use></svg><span>Тренировка</span>
        </a>
        <a th:href="@{/topics}" th:classappend="${active == 'topics'} ? 'active'"
           th:attr="aria-current=${active == 'topics'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#topics"></use></svg><span>Темы</span>
        </a>
        <a th:href="@{/stats}" th:classappend="${active == 'analytics'} ? 'active'"
           th:attr="aria-current=${active == 'analytics'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#analytics"></use></svg><span>Аналитика</span>
        </a>
        <a th:href="@{/review}" th:classappend="${active == 'review'} ? 'active'"
           title="Разбор ошибок"
           th:attr="aria-current=${active == 'review'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#repeat"></use></svg><span>Ошибки</span>
        </a>
        <a th:href="@{/bookmarks}" th:classappend="${active == 'bookmarks'} ? 'active'"
           th:attr="aria-current=${active == 'bookmarks'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#bookmark"></use></svg><span>Закладки</span>
        </a>
        <a th:href="@{/settings}" th:classappend="${active == 'settings'} ? 'active'"
           th:attr="aria-current=${active == 'settings'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#settings"></use></svg><span>Настройки</span>
        </a>
    </nav>
    <!--/* Футер рельса — глобальные действия приложения (не разделы). Отбит от
         навигации пустотой (margin-top:auto в shell.css) и линией, и лежит ЗА
         пределами <nav>: в списке ориентиров скринридера этих строк нет, так
         что «ещё одним пунктом меню» они не читаются — ровно та претензия, из-за
         которой тогл темы когда-то отсюда унесли в topbar. Полосы topbar больше
         нет (см. fragments/shell-head.html), поэтому контрол вернулся сюда — и
         впервые получил видимую подпись.

         Строка = `.side-action`, тот же вид, что у пунктов навигации выше и у
         «Выйти» рядом: два разных вида кнопки в одном футере читались бы как
         два разных класса действий. Подпись тогла ставит ui/shell.js и она же
         идёт в aria-label (WCAG 2.5.3): серверная «Переключить тему» —
         состояние до JS, кнопка до него скрыта (hidden). */-->
    <div class="sidebar-footer">
        <button type="button" class="side-action hidden" data-theme-toggle
                aria-label="Переключить тему" title="Переключить тему">
            <svg class="icon" aria-hidden="true"><use href="#theme"></use></svg>
            <span data-theme-label>Переключить тему</span>
        </button>
        <form th:if="${multiSecurityMode}" class="shell-logout" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="side-action"
                    th:aria-label="${currentUsername != null ? ('Выйти (' + currentUsername + ')') : 'Выйти'}"
                    th:title="${currentUsername != null ? ('Выйти (' + currentUsername + ')') : 'Выйти'}">
                <svg class="icon" aria-hidden="true"><use href="#logout"></use></svg>
                <span>Выйти</span>
            </button>
        </form>
    </div>
</aside>
</body>
</html>
