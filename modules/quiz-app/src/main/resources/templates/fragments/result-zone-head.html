<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="result-zone-head(id, chipText, hintText, hidden)">
    <div th:attr="id=${id}"
         data-ui-fragment="result-zone-head"
         th:class="${hidden} ? 'result-zone-head hidden' : 'result-zone-head'">
        <span class="zone-chip" th:text="${chipText}">Результат</span>
        <span class="zone-hint" th:text="${hintText}">Кратко и по делу, затем детальный разбор</span>
    </div>
</div>
</body>
</html>
