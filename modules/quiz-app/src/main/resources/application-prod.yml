# ===========================
# Продакшн-профиль
# ===========================
spring:
  thymeleaf:
    cache: true
  datasource:
    hikari:
      # leak-detection — только для dev/default (30s в application.yml).
      # В prod отключаем: иначе ложные stack trace на длинных batch/import.
      leak-detection-threshold: 0
  web:
    resources:
      # Content-hash версионирование статики (OPS-004): Thymeleaf @{/css/app.css}
      # → /css/app-<hash>.css через ResourceUrlEncodingFilter.
      chain:
        strategy:
          content:
            enabled: true
      # Сам по себе `@{...}` покрывает не всё: относительные `import '../core/dom.js'`
      # внутри модулей и пути к спрайтам в pixel-fx.js — это строки в .js, шаблонизатор
      # их не видит, а сборщика в проекте нет по решению (см. frontend-architecture.md).
      # Пока эти адреса были безверсионными, годовой max-age означал бы, что правка
      # такого файла не доедет до вернувшегося браузера никогда, и кэш держали часом.
      # StaticVersionAdvice закрывает разрыв: import map для 39 модулей и JSON-карта
      # для спрайтов лежат в HTML (no-store), поэтому версия есть у каждого адреса,
      # который реально запрашивает браузер, и год здесь безопасен.
      cache:
        cachecontrol:
          max-age: ${STATIC_RESOURCES_CACHE_SECONDS:31536000}s
          cache-public: true

# В prod-профиле метрики тегаются env=prod по умолчанию. Можно перекрыть
# APP_ENV=staging если ставится staging-вариант на тот же образ.
management:
  metrics:
    tags:
      env: ${APP_ENV:prod}

# Swagger UI и публичный OpenAPI-JSON выключены в проде, чтобы не светить
# API-карту наружу. UI остаётся доступным в default-профиле для разработки.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  # В production токен обязателен: без него приложение не стартует.
  admin-token: ${APP_ADMIN_TOKEN}
  security:
    # Hybrid: local требует явного ack для public/prod deploy.
    mode: ${APP_SECURITY_MODE:local}
    allow-insecure-public: ${APP_SECURITY_ALLOW_INSECURE_PUBLIC:false}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://localhost}
