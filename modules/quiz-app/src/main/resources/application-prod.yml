# ===========================
# Продакшн-профиль
# ===========================
spring:
  thymeleaf:
    cache: true

# Swagger UI и публичный OpenAPI-JSON выключены в проде, чтобы не светить
# API-карту наружу. UI остаётся доступным в default-профиле для разработки.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  # В production токен обязателен: без него приложение не стартует.
  admin-token: ${APP_ADMIN_TOKEN}
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://localhost}
