repos:
  - repo: local
    hooks:
      - id: cheatsheet-lint
        name: Cheatsheet lint (13 правил + TOC якоря)
        entry: python3 scripts/cheatsheet-lint.py cheatsheets
        language: system
        pass_filenames: false
        files: ^cheatsheets/.*\.md$
        stages: [pre-commit]

      - id: verify-mcq-json
        name: verify mcq json seeds against schema
        entry: bash scripts/verify-mcq-json.sh
        language: system
        pass_filenames: true
        files: ^modules/quiz-app/src/main/resources/seed/mcq/.*\.json$
        stages: [pre-commit]

      - id: verify-md-no-mcq
        name: verify .md files have no legacy mcq
        entry: bash scripts/verify-md-no-mcq.sh
        language: system
        pass_filenames: true
        files: ^cheatsheets/interview/.*\.md$
        stages: [pre-commit]
