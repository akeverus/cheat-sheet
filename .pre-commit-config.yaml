repos:
  - repo: local
    hooks:
      - id: cheatsheet-lint
        name: Cheatsheet lint (13 правил + TOC якоря)
        entry: python3 scripts/cheatsheet-lint.py cheatsheets
        language: system
        pass_filenames: false
        files: ^cheatsheets/.*\.md$
        stages: [pre-commit]

      - id: verify-mcq
        name: Verify MCQ blocks (format + banned phrases)
        entry: bash scripts/verify-mcq.sh
        language: system
        pass_filenames: true
        files: ^cheatsheets/interview/.*\.md$
        stages: [pre-commit]
