# Лёгкий sandbox-вариант без Postgres: SQLite в volume.
# Используй когда не хочется поднимать БД:
#   docker compose -f docker-compose.sqlite.yml up -d
services:
  interview-prep:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
    image: cheat-sheet-quiz:${APP_VERSION:-latest}
    container_name: quiz-app-sqlite
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
      SPRING_PROFILES_ACTIVE: prod
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:?APP_ADMIN_TOKEN is required in prod profile}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://localhost}
      REGENERATE_RATE_LIMIT_PER_MINUTE: ${REGENERATE_RATE_LIMIT_PER_MINUTE:-20}
    volumes:
      - quiz-data:/app/data
      - ./cheatsheets:/app/cheatsheets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  quiz-data:
    driver: local
