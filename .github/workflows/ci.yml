name: CI

on:
  push:
    branches: [master]
    paths:
      - 'modules/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'e2e/**'
      - 'scripts/verify-ci-e2e-gate.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'modules/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'e2e/**'
      - 'scripts/verify-ci-e2e-gate.sh'
      - '.github/workflows/ci.yml'

# Не держать параллельные раны на одной ветке/PR — экономия минут раннера.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build · Test · Jacoco
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Кэш Gradle-зависимостей + wrapper между ранами.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify e2e gate contract
        run: bash scripts/verify-ci-e2e-gate.sh

      - name: Build (no tests)
        run: ./gradlew build -x test --no-daemon

      # `check` гоняет тесты + jacocoTestCoverageVerification + ArchUnit —
      # один gate как в local-verify.
      - name: Run tests + coverage + arch checks
        run: ./gradlew check --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            modules/*/build/reports/tests/
            modules/*/build/test-results/
          retention-days: 7

      - name: Upload jacoco HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: modules/quiz-app/build/reports/jacoco/test/html/
          retention-days: 14

  e2e:
    name: E2E · Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: interview
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Рецептура подъёма приложения — visual-goldens.yml (тот же job уже
      # проверен в CI): service-контейнер postgres + фоновый bootRun + поллинг
      # /actuator/health.
      - name: Boot app (background)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/interview
          SPRING_DATASOURCE_USERNAME: interview
          SPRING_DATASOURCE_PASSWORD: interview
          APP_SECURITY_MODE: local
          APP_ADMIN_TOKEN: ci-e2e-token
        run: |
          ./gradlew :quiz-app:bootRun -q > /tmp/bootRun.log 2>&1 &
          echo $! > /tmp/bootRun.pid
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null \
              || curl -sf http://localhost:8080/ >/dev/null; then
              echo "app up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "bootRun failed to become ready" >&2
          tail -n 200 /tmp/bootRun.log >&2 || true
          exit 1

      - name: Run e2e specs
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npx playwright test \
            console-clean.spec.js \
            reflow.spec.js \
            keyboard-quiz.spec.js \
            --project=chromium

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            /tmp/bootRun.log
          retention-days: 7

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/bootRun.pid ]; then
            kill "$(cat /tmp/bootRun.pid)" 2>/dev/null || true
          fi

  docker-build:
    name: Docker image · smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-test
    # Only on master pushes — для PR build пропускаем чтобы не съесть minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set build metadata
        id: meta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # Не пушим в registry — только smoke build, чтобы поймать сломанный Dockerfile.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cheat-sheet-quiz:ci-${{ github.sha }}
          # OCI labels из cycle #51/#52: image.created + image.revision
          # подсасываются Dockerfile из этих ARG'ов.
          build-args: |
            VERSION=ci-${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
